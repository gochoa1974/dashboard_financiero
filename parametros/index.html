<style>
:root{
  --bg:var(--fondo);--surface:var(--tarjeta);--ink:var(--texto);--mut:var(--texto-2);--line:var(--linea);
  --hero1:var(--hero-a);--hero2:var(--hero-b);--hero-mute:#9fc0d3;
  --accent:var(--acento);--accent-t:var(--acento-texto);--accent-ink:#04261a;--accent-bg:color-mix(in srgb,var(--acento) 14%,transparent);
  --warn:var(--pendiente);--warn-bg:color-mix(in srgb,var(--pendiente) 14%,transparent);--info-bg:color-mix(in srgb,var(--texto-2) 14%,transparent);
  --bad:var(--error);
  --shadow:0 1px 2px rgba(10,34,51,.05),0 8px 20px -12px rgba(10,34,51,.2)
}
:root[data-modo="oscuro"]{--shadow:0 1px 2px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root[data-modo="auto"]{--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;padding:20px 16px 48px;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:640px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:14px;min-height:36px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;
  border-radius:24px;padding:22px 20px;box-shadow:0 18px 34px -16px rgba(10,34,51,.7);text-align:center;margin-bottom:18px}
.hero h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:6px 0 0;font-size:13px;color:var(--hero-mute);font-weight:600}

.gate{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow)}
.gate h2{margin:0 0 6px;font-size:16px;font-weight:800}
.gate p{margin:0 0 14px;font-size:13px;color:var(--mut);font-weight:600;line-height:1.5}
.pw{display:flex;gap:8px}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;background:var(--bg);color:var(--ink);width:100%;min-height:46px}
textarea{resize:vertical;min-height:72px;line-height:1.45}
input.bad,textarea.bad{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--error) 22%,transparent)}
.btn{appearance:none;border:none;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;min-height:44px;transition:transform .12s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn-acc{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn-edit{background:var(--accent-bg);color:var(--accent-t);border:1px solid var(--accent)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px;min-height:40px}
.btn-bad{background:var(--bad);color:#fff}
.btn svg{width:15px;height:15px;flex:none}
.msg{font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
#app{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800}
.card .hint{margin:0 0 14px;font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.5}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:12.5px;color:var(--mut);font-weight:700}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[readonly]{opacity:.8;cursor:not-allowed}
.small{font-size:12px;color:var(--mut);font-weight:600;margin-top:6px;line-height:1.45}

.codigo{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;background:var(--bg)}
.codigo b{font-size:14px;font-weight:800;overflow-wrap:anywhere}
.codigo span{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}

.alerta{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.alerta.info{border-color:var(--line);background:var(--info-bg)}
.alerta b{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--warn);margin-bottom:6px}
.alerta.info b{color:var(--mut)}
.alerta ul{margin:0;padding-left:18px;font-size:12.5px;font-weight:600;line-height:1.55}
.alerta li.inf{color:var(--mut)}

.chips{display:grid;grid-template-columns:1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{appearance:none;font-family:inherit;font-weight:700;font-size:13px;line-height:1.25;text-align:left;min-height:48px;padding:10px 12px;
  border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:transform .12s,border-color .15s,background .15s,color .15s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-t)}
.chip small{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-top:1px}
.chip.on small{color:var(--accent-t)}
.seg .chip{justify-content:center;text-align:center}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);transition:all .15s}
.chip.on .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}

.tramo{border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px;margin-bottom:12px;background:var(--bg)}
.tramo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:13.5px;font-weight:800}
.tramo-h small{font-size:11.5px;font-weight:700;color:var(--mut);margin-left:6px}
.tramo input,.tramo select{background:var(--surface)}
.noche{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin-bottom:8px}
.noche .nd{font-size:14px;font-weight:700}
.noche .nd small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.noche input{background:var(--surface);text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.chk{border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;margin:4px 0 12px;border:1px solid var(--line);background:var(--bg)}
.chk.ok{color:var(--ok,#0a7d4b);border-color:currentColor}
.chk.bad{color:var(--bad)}
.link{appearance:none;background:none;border:none;padding:10px 0;margin:0;color:var(--accent-t);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;min-height:44px}
.link.bad{color:var(--bad)}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:stretch}
.stp{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font-family:inherit;font-size:22px;font-weight:800;min-height:48px;cursor:pointer;transition:transform .12s}
.stp:active{transform:scale(.94)}
.stepper input{text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.stat .k{font-size:11.5px;color:var(--mut);font-weight:700}
.stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}

.sticky{position:sticky;bottom:10px;z-index:20;margin-top:12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px -10px rgba(10,34,51,.35)}
.sticky .msg{margin:0 0 8px;min-height:0}
.sticky .msg:empty{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.sticky .btn-acc{flex:1;min-height:48px}
.sticky .btn-ghost{min-height:48px}

.list-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.list-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.list-item b{font-size:14px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent-t);white-space:nowrap}
.list-item .meta{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:4px;line-height:1.55}
.list-item .tot{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.list-item .cmt{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.list-item .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.list-item.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.empty{font-size:13px;color:var(--mut);font-weight:600;text-align:center;padding:18px 0}
@media (min-width:900px){.wrap{max-width:760px}.chips{grid-template-columns:repeat(3,1fr)}}
@media (max-width:380px){.row2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.apphead{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.backbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:0 0 auto;text-decoration:none;box-shadow:var(--shadow)}
.backbtn:active{transform:scale(.94)}
.backbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.apphead .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block;flex:0 0 auto}
.apphead .ttl{min-width:0}
.apphead .ttl b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.apphead .ttl span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}

.vig{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);margin-bottom:14px}
.vig .k{font-size:12px;color:var(--mut);font-weight:700}
.vig .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.vig .o{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-bg);color:var(--accent-t);white-space:nowrap}
.vig .o.ex{background:var(--warn-bg);color:var(--warn)}
.sec{font-size:12.5px;font-weight:800;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.it .t{font-size:13px;font-weight:700;line-height:1.4;min-width:0}
.it .t small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.it .val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.it .btns{display:flex;gap:8px;width:100%}
.frm{border:1px dashed var(--accent);border-radius:14px;padding:12px 12px 2px;margin:10px 0;background:var(--surface)}
.frm h4{margin:0 0 10px;font-size:13.5px;font-weight:800}
.nada{font-size:12.5px;color:var(--mut);font-weight:600;padding:4px 0 8px}
details summary{cursor:pointer;font-size:12.5px;font-weight:800;color:var(--accent-t);padding:8px 0;min-height:40px;display:flex;align-items:center}
.hist .it{opacity:.85}
.apphead{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.backbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:0 0 auto;text-decoration:none;box-shadow:var(--shadow)}
.backbtn:active{transform:scale(.94)}
.backbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.apphead .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block;flex:0 0 auto}
.apphead .ttl{min-width:0}
.apphead .ttl b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.apphead .ttl span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
@media (min-width:900px){.wrap{max-width:760px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v7: rubros ===== */
.wrap{max-width:640px}
@media (min-width:900px){.wrap{max-width:1040px}}
.cfg{display:block}
@media (min-width:900px){.cfg{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}.cfg nav{position:sticky;top:16px}}
.nv{display:flex;flex-direction:column;gap:6px}
.nvi{appearance:none;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:var(--shadow);transition:transform .12s,border-color .15s,background .15s}
.nvi:active{transform:scale(.985)}
.nvi.on{border-color:var(--accent);background:var(--accent-bg)}
.nvi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-bg);display:grid;place-items:center;flex:none}
.nvi .ic svg{width:19px;height:19px;stroke:var(--accent-t);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nvi .tx{flex:1;min-width:0}
.nvi .tx b{display:block;font-size:14.5px;font-weight:800}
.nvi .tx small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
.nvi .ch{color:var(--mut);font-size:20px;flex:none}
.nvh{font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:14px 4px 4px}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.ph h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.pback{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
.pd{margin:0 0 14px;font-size:13px;color:var(--mut);font-weight:600;line-height:1.5}
.gt{font-size:12px;font-weight:800;color:var(--mut);margin:16px 4px 6px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{appearance:none;font-family:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;display:flex;align-items:center;gap:10px;min-height:60px;padding:11px 14px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--accent-bg)}
.row .rt{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.3}
.row .rt small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.row .rv{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .ch{color:var(--mut);font-size:18px}
.stats{margin-bottom:6px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.cal .hd,.cal .rw{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));gap:4px;align-items:center;padding:11px 12px}
.cal .hd{font-size:11px;font-weight:800;color:var(--mut);border-bottom:1px solid var(--line);background:var(--bg)}
.cal .hd span{text-align:right}
.cal .hd span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:currentColor}
.cal .hd .l1{color:var(--warn)}.cal .hd .l2,.cal .hd .l3{color:var(--accent-t)}.cal .hd .l4{color:var(--accent-t)}
.cal .rw{appearance:none;font-family:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer;min-height:56px}
.cal .rw:last-child{border-bottom:0}
.cal .rw:active{background:var(--accent-bg)}
.cal .rw b{font-size:13.5px;font-weight:800;line-height:1.25}
.cal .rw i{font-style:normal;text-align:right;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.bgs{position:fixed;inset:0;background:rgba(5,15,25,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.bgs.on{opacity:1;pointer-events:auto}
.shx{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));z-index:51;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .25s;box-shadow:0 -12px 40px -12px rgba(0,0,0,.4);max-width:560px;margin:0 auto}
.shx.on{transform:none}
@media (min-width:900px){.shx{bottom:auto;top:50%;border-radius:22px;transform:translateY(-40%) scale(.97);opacity:0;pointer-events:none}.shx.on{transform:translateY(-50%);opacity:1;pointer-events:auto}}
.shx .gr{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.shx h3{margin:0 0 2px;font-size:17px;font-weight:800}
.shx .sd{margin:0 0 14px;font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.45}
.lv{display:flex;align-items:center;gap:6px}
.lv::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lv.l1::before{background:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--surface);font-size:13px;font-weight:700;padding:11px 16px;border-radius:12px;z-index:60;transition:all .25s;max-width:calc(100vw - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}
/* ===== Calendario de rango (estilo Airbnb) · componente compartido v1 + modo inclusivo ===== */
.rf-btn{min-width:0;display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;text-align:left;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .12s}
.rf-btn:active{transform:scale(.99)}
.rf-btn svg{width:18px;height:18px;flex:none;color:var(--mut)}
.rf-btn .rf-v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-btn .rf-v.rf-ph{color:var(--mut);font-weight:500}
.rf-btn.bad,.rf-btn.bad-field{border-color:var(--bad);box-shadow:0 0 0 3px rgba(220,38,38,.18)}
.rf-ov{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center;background:rgba(7,23,34,.55);
  opacity:0;transition:opacity .18s}
.rf-ov.rf-on{opacity:1}
.rf-p{position:relative;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);color:var(--ink);
  border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -18px 40px -18px rgba(0,0,0,.5);
  transform:translateY(24px);transition:transform .2s ease-out;font-family:inherit}
.rf-ov.rf-on .rf-p{transform:none}
.rf-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.rf-top h4{margin:0;font-size:16px;font-weight:800}
.rf-help{margin:2px 0 0;font-size:12.5px;font-weight:700;color:var(--accent-t);min-height:18px}
.rf-x{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:12px;width:44px;height:44px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.rf-x svg{width:18px;height:18px}
.rf-sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:12px;align-items:stretch}
.rf-s{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px;
  font-family:inherit;cursor:pointer;min-height:48px;min-width:0}
.rf-s small{display:block;font-size:11px;font-weight:700;color:var(--mut)}
.rf-s b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-s.rf-act{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.rf-n{display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:12px;background:var(--accent-bg);color:var(--accent-t);
  font-size:13px;font-weight:800;white-space:nowrap}
.rf-n:empty{display:none}
.rf-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rf-nav button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.rf-nav button svg{width:18px;height:18px}
.rf-nav button[disabled]{opacity:.35;cursor:default}
.rf-ms{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.rf-m h5{margin:0 0 6px;text-align:center;font-size:14px;font-weight:800;text-transform:capitalize}
.rf-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.rf-w{text-align:center;font-size:11.5px;font-weight:700;color:var(--mut);padding:4px 0}
.rf-d{appearance:none;border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;height:44px;width:100%;
  border-radius:0;cursor:pointer;position:relative;padding:0;z-index:0}
.rf-d::before{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:transparent;z-index:-1;transition:background .12s}
.rf-d:hover:not([disabled]):not(.rf-st):not(.rf-en)::before{background:var(--accent-bg)}
.rf-d.rf-hoy::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.rf-d.rf-mid,.rf-d.rf-pv{background:var(--accent-bg)}
.rf-d.rf-mid.rf-c0,.rf-d.rf-pv.rf-c0{border-radius:22px 0 0 22px}
.rf-d.rf-mid.rf-c6,.rf-d.rf-pv.rf-c6{border-radius:0 22px 22px 0}
.rf-d.rf-st.rf-tieneco{background:linear-gradient(to right,transparent 50%,var(--accent-bg) 50%)}
.rf-d.rf-en{background:linear-gradient(to left,transparent 50%,var(--accent-bg) 50%)}
.rf-d.rf-st::before,.rf-d.rf-en::before{background:var(--accent)}
.rf-d.rf-st.rf-en{background:transparent}
.rf-d.rf-st,.rf-d.rf-en{color:var(--accent-ink)}
.rf-d.rf-st.rf-hoy::after,.rf-d.rf-en.rf-hoy::after{background:var(--accent-ink)}
.rf-d.rf-oc{color:var(--bad)}
.rf-d.rf-oc::before{background:rgba(220,38,38,.14)}
.rf-d.rf-oc.rf-mid{background:rgba(220,38,38,.10)}
.rf-d.rf-oc.rf-st,.rf-d.rf-oc.rf-en{color:var(--accent-ink)}
.rf-leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;font-weight:700;color:var(--mut)}
.rf-leg span{display:inline-flex;align-items:center;gap:6px}
.rf-sw{display:inline-block;width:14px;height:14px;border-radius:50%}
.rf-sw-oc{background:rgba(220,38,38,.28);border:1px solid var(--bad)}
.rf-sw-sel{background:var(--accent)}
.rf-warn{margin-top:12px;border:1px solid var(--bad);background:rgba(220,38,38,.08);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.rf-warn b{color:var(--bad);font-weight:800}
.rf-warn span{color:var(--ink);font-weight:600}
.rf-wb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.rf-igual{appearance:none;border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:12px;font-family:inherit;font-weight:800;font-size:13px;min-height:44px;padding:0 14px;cursor:pointer}
.rf-d.rf-pop{animation:rfpop .18s ease-out}
.rf-d[disabled]{opacity:.3;cursor:default}
.rf-d.rf-fuera{visibility:hidden}
.rf-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.rf-clr{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:12px;font-family:inherit;
  font-weight:800;font-size:13px;min-height:44px;padding:0 14px;cursor:pointer}
.rf-foot .rf-hint{font-size:12px;color:var(--mut);font-weight:600}
.rf-lock{overflow:hidden!important}
@keyframes rfpop{0%{transform:scale(.9)}100%{transform:scale(1)}}
@media (min-width:720px){
  .rf-ov{align-items:center}
  .rf-p{width:auto;min-width:420px;max-width:760px;border-radius:22px;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);transform:translateY(10px)}
  .rf-p.rf-dos{width:700px}
  .rf-p.rf-dos .rf-ms{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
}
@media (max-width:560px){.rf-sum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rf-n{grid-column:1/-1;min-height:34px}}
@media (max-width:420px){.rf-btn{font-size:15px;padding:11px 10px;gap:0}.rf-btn svg{display:none}}
@media (prefers-reduced-motion:reduce){.rf-ov,.rf-p,.rf-d.rf-pop{transition:none;animation:none}}
</style>

<body>
<div class="wrap">
  <header class="apphead">
    <a class="backbtn" href="../dashboard/" aria-label="Volver al dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <img class="logo" src="../Cima-Blanca-logo.png" alt="Cima Blanca">
    <div class="ttl"><b>Cima Blanca</b><span>Configuración · v9</span></div>
  </header>

  <div id="gate" class="gate">
    <h2>Conectar con tu hoja</h2>
    <p>Escribe tu clave una sola vez. Se guarda en este dispositivo y sirve para todos los módulos.</p>
    <div class="pw">
      <input type="password" id="gateKey" placeholder="Tu clave" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Clave">
      <button type="button" class="btn btn-ghost btn-sm" id="gateEye">Ver</button>
    </div>
    <div style="margin-top:10px"><button type="button" class="btn btn-acc" id="gateGo">Conectar</button></div>
    <div class="msg" id="gateMsg" role="status"></div>
  </div>

  <div id="app">
    <div class="sync"><span id="syncHint">Sin sincronizar</span><button type="button" class="btn btn-ghost btn-sm" id="syncBtn">Actualizar</button></div>
    <div class="cfg">
      <nav id="nav" aria-label="Rubros de configuración"></nav>
      <section id="cards" aria-live="polite"></section>
    </div>
    <div class="msg" id="msg" role="status" hidden></div>
  </div>
</div>

<div class="bgs" id="sbg"></div>
<div class="shx" id="shx" role="dialog" aria-modal="true" aria-labelledby="shT" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
// ===== URL de tu implementación de Apps Script de PARÁMETROS (termina en /exec) =====
const FIXED_URL = 'https://script.google.com/macros/s/AKfycbxJX9a0T36KJWdDB4sGZ0FAGufRCTRwQgxmUwGQqZAlXu5754Jh2ghxv6nU8wkMmqV8xw/exec';

const $ = id => document.getElementById(id);
const SHARED_KEY = 'cimablanca_clave';
const LEGACY_KEYS = ['cimablanca_canc_cfg', 'cimablanca_dir_cfg', 'cb_gastos_cfg_v1'];
function getClave() {
  try {
    const k = localStorage.getItem(SHARED_KEY);
    if (k) return k;
    for (const lk of LEGACY_KEYS) {
      const o = JSON.parse(localStorage.getItem(lk) || 'null');
      if (o && o.clave) { localStorage.setItem(SHARED_KEY, o.clave); return o.clave; }
    }
  } catch (e) {}
  return '';
}
function setClave(k) { try { localStorage.setItem(SHARED_KEY, k); } catch (e) {} }
function clearClave() { try { localStorage.removeItem(SHARED_KEY); LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {} }
function claveRechazada(modulo) {
  CFG = {}; clearClave();
  $('app').style.display = 'none'; $('gate').style.display = 'block';
  const m = $('gateMsg'); m.className = 'msg err';
  m.textContent = 'La clave ya no es válida en ' + modulo + '. Escríbela de nuevo.';
}

const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
let CFG = {};
{ const k0 = getClave(); if (k0) CFG = { url: FIXED_URL, clave: k0 }; }
let DATA = null, abierto = null; // abierto: {p, modo:'base'|'exc', id}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fb(iso) { if (!iso) return ''; const x = iso.split('-'); return +x[2] + ' ' + MESES[+x[1] - 1] + ' ' + x[0]; }
const fnum = (n, d) => { n = Number(n) || 0; const p = Math.abs(n).toFixed(d == null ? 2 : d).split('.'); return (n < 0 ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : ''); };
function fmt(p, v) { if (p.unidad === 'OPCION') { const o = p.opciones || []; return (v == null || v === '' || o[Number(v)] == null) ? 'Sin definir' : o[Number(v)]; } if (v == null || v === '') return '—'; if (p.unidad === 'MES') { const n = Number(v), m = n % 100, y = Math.floor(n / 100); return MESES[m - 1] + ' ' + y; } const n = Math.round(Number(v) * 100) / 100; if (p.unidad === '%') return fnum(n, 2).replace(/,?0+$/, '') + '%'; return '$' + fnum(n, Number.isInteger(n) ? 0 : 2); }

function usuarioCB() { try { var p = window.CB && window.CB.perfil; return p ? String(p.usuario || p.nombre || '') : ''; } catch (e) { return ''; } }
async function call(body) {
  if (!CFG.url || CFG.url.indexOf('PEGA-AQUI') >= 0) throw new Error('Falta pegar la URL del Apps Script de Parámetros en el archivo.');
  const r = await fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ clave: CFG.clave, usuario: usuarioCB() }, body)) });
  const j = await r.json();
  if (!j.ok) { if (/Clave incorrecta/.test(String(j.error))) claveRechazada('Configuración'); throw new Error(j.error || 'Error desconocido'); }
  return j;
}
function showApp() { $('gate').style.display = 'none'; $('app').style.display = 'block'; pintarAirbnb(); }
function fechaHora(d) { return d.toLocaleDateString('es-EC', { day: 'numeric', month: 'short' }).replace('.', '') + ' · ' + d.toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit', hour12: false }); }
function setHint(ok) { $('syncHint').textContent = ok ? 'Valores revisados hoy ' + new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit', hour12: false }) : 'Sin datos aún'; }
/* Última vez que se generaron los datos de Airbnb: la guarda Sincronizar o Ingresos en este dispositivo. */
function pintarAirbnb() {
  const el = $('airbnbInfo'); if (!el) return;
  let d = null;
  try { const i = JSON.parse(localStorage.getItem('cimablanca_sync_info') || 'null'); if (i && i.t) d = new Date(i.t); } catch (e) {}
  if (!d || isNaN(d)) { try { const c = JSON.parse(localStorage.getItem('cimablanca_ing_maestro') || 'null'); if (c && c.mod) d = new Date(c.mod); } catch (e) {} }
  el.textContent = d && !isNaN(d) ? 'Datos de Airbnb al ' + fechaHora(d) : 'Datos de Airbnb: abre Ingresos para ver la fecha';
}
function aplicar(j) { DATA = j; render(); }

async function conectar(clave) {
  $('gateMsg').className = 'msg'; $('gateMsg').textContent = 'Conectando...';
  CFG = { url: FIXED_URL, clave: clave };
  try { const j = await call({ accion: 'listar' }); setClave(clave); showApp(); aplicar(j); setHint(true); }
  catch (e) { $('gateMsg').className = 'msg err'; $('gateMsg').textContent = String(e.message || e); CFG = {}; }
}
$('gateGo').onclick = () => { const k = $('gateKey').value.trim(); if (!k) { $('gateMsg').className = 'msg err'; $('gateMsg').textContent = 'Escribe tu clave.'; return; } conectar(k); };
$('gateEye').onclick = () => { const i = $('gateKey'); i.type = i.type === 'password' ? 'text' : 'password'; };
$('gateKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('gateGo').click(); });
$('syncBtn').onclick = async () => { $('syncHint').textContent = 'Actualizando...'; try { aplicar(await call({ accion: 'listar' })); setHint(true); } catch (e) { $('syncHint').textContent = 'Error: ' + (e.message || e); } };

function hoyISO() { return (DATA && DATA.hoy) || new Date().toISOString().slice(0, 10); }

function formHtml(k, p) {
  const a = abierto; if (!a || a.p !== k) return '';
  if (a.modo === 'base') {
    return '<div class="frm" data-p="' + k + '"><h4>Cambiar valor base</h4><div class="row2">' +
      '<div class="field"><label for="f_v">Nuevo valor (' + esc(p.unidad === '%' ? '%' : p.unidad === 'MES' ? 'mes' : '$') + ')</label>' + (p.unidad === 'MES' ? '<input type="month" id="f_v" value="' + esc(a.v || '') + '">' : '<input type="number" inputmode="decimal" id="f_v" step="0.01" min="0" value="' + esc(a.v || '') + '">') + '</div>' +
      '<div class="field"><label for="f_d">Rige desde</label><input type="date" id="f_d" min="2024-01-01" max="2100-12-31" value="' + esc(a.d || hoyISO()) + '"></div></div>' +
      '<div class="small" style="margin:-4px 0 12px">El valor anterior se conserva en el historial. No cambia lo ya guardado en reservas.</div>' +
      '<div class="btns" style="display:flex;gap:8px;margin-bottom:12px"><button type="button" class="btn btn-acc btn-sm" data-ok="base">Guardar</button><button type="button" class="btn btn-ghost btn-sm" data-cancel>Cancelar</button></div></div>';
  }
  return '<div class="frm" data-p="' + k + '"><h4>' + (a.id ? 'Editar excepción' : 'Renegociado por fechas') + '</h4><div class="row2">' +
    '<div class="field"><label for="f_d">Desde</label><input type="date" id="f_d" min="2024-01-01" max="2100-12-31" value="' + esc(a.d || '') + '"></div>' +
    '<div class="field"><label for="f_h">Hasta (incluido)</label><input type="date" id="f_h" min="2024-01-01" max="2100-12-31" value="' + esc(a.h || '') + '"></div></div>' +
    '<div class="row2"><div class="field"><label for="f_v">Valor en ese período (' + esc(p.unidad === '%' ? '%' : '$') + ')</label><input type="number" inputmode="decimal" id="f_v" step="0.01" min="0" value="' + esc(a.v || '') + '"></div>' +
    '<div class="field"><label for="f_n">Nota (opcional)</label><input id="f_n" maxlength="120" placeholder="Ej. temporada baja" value="' + esc(a.n || '') + '"></div></div>' +
    '<div class="btns" style="display:flex;gap:8px;margin-bottom:12px"><button type="button" class="btn btn-acc btn-sm" data-ok="exc">Guardar</button><button type="button" class="btn btn-ghost btn-sm" data-cancel>Cancelar</button></div></div>';
}

const RUB = [
  { id: 'op', t: 'Operación', s: 'Limpieza y comisión de Airbnb', d: 'Valores estándar que usan Ingresos y Gastos. Lo ya guardado en reservas no se modifica: cada reserva conserva el valor con que se registró.', ic: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>' },
  { id: 'reg', t: 'Reglas de cálculo', s: 'Limpieza por canal, ADR y operación', d: 'Cómo se calculan las cifras de tu negocio. Cada anfitrión cobra distinto: elige lo que aplica a ti. Los cambios rigen desde la fecha que indiques y quedan en el historial.', ic: '<path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="15" r="3"/>' },
  { id: 'inv', t: 'Inversión', s: 'Compra, préstamo y valor', d: 'Datos de la inversión. Alimentan los indicadores de Resultados financieros. Cambia un valor y todo se recalcula; cada cambio queda en el historial.', ic: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>' },
  { id: 'cal', t: 'Calificación de indicadores', s: 'De Malo a Excelente', d: 'Cada indicador se califica Malo, Regular, Bueno, Muy bueno o Excelente. Pon el valor mínimo para llegar a cada nivel; por debajo de Regular es Malo. Toca una fila para editarla.', ic: '<path d="M5 20V10M12 20V4M19 20v-7"/>' }
];
const INV_GRUPOS = [['Compra', ['precio_compra', 'gastos_legales', 'muebles_equipamiento', 'fecha_compra']], ['Financiamiento', ['prestamo_hipotecario', 'saldo_hipoteca']], ['Valor actual', ['valor_departamento']], ['Estado de resultados', ['inicio_resultados']]];
const REG_GRUPOS = [['Limpieza por canal', ['modelo_limpieza_airbnb', 'modelo_limpieza_directas']], ['Operación', ['inicio_operacion']], ['ADR (precio promedio por noche)', ['restar_limpieza_del_adr', 'incluir_mascotas_en_adr', 'incluir_huesped_adicional_en_adr', 'adr_secundario_total_cobrado']]];
const CAL_IND = [['margen_neto', 'Margen neto'], ['cobertura', 'Cobertura de la deuda'], ['cap_rate', 'Cap rate'], ['roi', 'ROI'], ['roe', 'ROE'], ['retorno_capital', 'Retorno sobre capital propio']];
const CAL_NIV = ['Regular', 'Bueno', 'Muy bueno', 'Excelente'];
let rub = null;
const wide = () => window.matchMedia('(min-width:900px)').matches;

function toast(t, err) { const e = $('toast'); e.textContent = t; e.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => { e.className = 'toast'; }, err ? 6000 : 3200); }
function msg(t, c) { if (t) toast(t, c === 'err'); }

function cardHtml(k) {
  const p = DATA.parametros[k], h = p.hoy, ex = h.origen === 'excepcion';
  const baseVig = p.bases.filter(b => b.desde <= hoyISO()).slice(-1)[0] || p.bases[0];
  const excs = p.excepciones.map(x =>
    '<div class="it"><div class="t">' + fb(x.desde) + ' → ' + fb(x.hasta) + '<small>' + esc(x.nota || 'Sin nota') + '</small></div><div class="val">' + fmt(p, x.valor) + '</div>' +
    '<div class="btns"><button type="button" class="btn btn-edit btn-sm" data-edit="' + esc(x.id) + '" data-p="' + k + '">Editar</button>' +
    '<button type="button" class="btn btn-ghost btn-sm" data-del="' + esc(x.id) + '" data-firma="' + esc(x.firma || '') + '">Borrar</button></div></div>').join('');
  const hist = p.bases.slice().reverse().map(b => '<div class="it"><div class="t">Desde ' + fb(b.desde) + '<small>' + esc(b.nota || '') + '</small></div><div class="val">' + fmt(p, b.valor) + '</div></div>').join('');
  return '<div class="card" data-card="' + k + '"><h3>' + esc(p.nombre) + '</h3>' +

    panel.addEventListener('mouseover', e => {
      const d = e.target.closest && e.target.closest('.rf-d');
      if (!d || d.disabled || !st.ci || st.co) return;
      const f = d.dataset.d;
      panel.querySelectorAll('.rf-d').forEach(x => x.classList.toggle('rf-pv', x.dataset.d > st.ci && x.dataset.d < f));
    });
    panel.addEventListener('mouseleave', () => panel.querySelectorAll('.rf-pv').forEach(x => x.classList.remove('rf-pv')));
  }

  function abrir(c, k) {
    if (!ov) construir();
    cfg = c;
    const ci = vDesc.get.call(c.ci) || '', co = vDesc.get.call(c.co) || '';
    st = { ci: ci || null, co: (ci && co && (cfg.inc ? co >= ci : co > ci)) ? co : null, etapa: (k === 'co' && ci) ? 'co' : 'ci', mes: null, foco: null, cierre: null, aviso: null };
    const ref = (k === 'co' && co) ? co : (ci || hoy());
    const o = parse(ref) || parse(hoy());
    st.mes = { y: o.y, m: o.m };
    st.foco = ref;
    ultimoFoco = document.activeElement;
    ov.hidden = false;
    document.documentElement.classList.add('rf-lock');
    render(true);
    requestAnimationFrame(() => ov.classList.add('rf-on'));
  }

  function cerrar() {
    if (!ov || ov.hidden) return;
    clearTimeout(st && st.cierre);
    ov.classList.remove('rf-on');
    const fin = () => { ov.hidden = true; document.documentElement.classList.remove('rf-lock'); };
    const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if (rm) fin(); else setTimeout(fin, 180);
    const volver = (st && st.etapa === 'ok') ? cfg.coBtn : (ultimoFoco && ultimoFoco.focus ? ultimoFoco : null);
    if (volver) { try { volver.focus(); } catch (e) {} }
  }

  function mesesVisibles() {
    const n = dosMeses() ? 2 : 1, out = [];
    for (let i = 0; i < n; i++) { let m = st.mes.m + i, y = st.mes.y; if (m > 11) { m -= 12; y++; } out.push({ y, m }); }
    return out;
  }

  function render(foco) {
    const L = limites(), hoyS = hoy(), meses = mesesVisibles(), OC = mapaOcupado();
    st.oc = OC;
    panel.classList.toggle('rf-dos', meses.length === 2);
    const nn = (st.ci && st.co) ? noches(st.ci, st.co) + (cfg.inc ? 1 : 0) : 0;
    const ayuda = cfg.ayuda ? (st.etapa === 'ci' ? cfg.ayuda.ci : (st.etapa === 'co' ? cfg.ayuda.co : '')) : (st.etapa === 'ci' ? 'Elige el día de ' + cfg.ciEtq.toLowerCase() : (st.etapa === 'co' ? 'Ahora elige el día de ' + cfg.coEtq.toLowerCase() : ''));
    const hayPrev = (st.mes.y * 12 + st.mes.m) > (parse(L.min).y * 12 + parse(L.min).m);
    const ult = meses[meses.length - 1], hayNext = (ult.y * 12 + ult.m) < (parse(L.max).y * 12 + parse(L.max).m);
    let h = '<div class="rf-top"><div><h4 id="rfTit">' + esc(cfg.titulo) + '</h4><p class="rf-help" aria-live="polite">' + esc(ayuda) + '</p></div>' +
      '<button type="button" class="rf-x" data-a="x" aria-label="Cerrar calendario">' + ICON_X + '</button></div>';
    h += '<div class="rf-sum"><button type="button" class="rf-s' + (st.etapa === 'ci' ? ' rf-act' : '') + '" data-a="sci"><small>' + esc(cfg.ciEtq) + '</small><b>' + (st.ci ? esc(bonita(st.ci)) : 'Elegir') + '</b></button>' +
      '<button type="button" class="rf-s' + (st.etapa === 'co' ? ' rf-act' : '') + '" data-a="sco"' + (st.ci ? '' : ' disabled') + '><small>' + esc(cfg.coEtq) + '</small><b>' + (st.co ? esc(bonita(st.co)) : 'Elegir') + '</b></button>' +
      '<div class="rf-n" aria-live="polite">' + (nn > 0 ? nn + (cfg.inc ? (nn === 1 ? ' día' : ' días') : (nn === 1 ? ' noche' : ' noches')) : '') + '</div></div>';
    h += '<div class="rf-nav"><button type="button" data-a="prev" aria-label="Mes anterior"' + (hayPrev ? '' : ' disabled') + '>' + ICON_L + '</button>' +
      '<button type="button" data-a="next" aria-label="Mes siguiente"' + (hayNext ? '' : ' disabled') + '>' + ICON_R + '</button></div><div class="rf-ms">';
    meses.forEach(mm => { h += mesHTML(mm, L, hoyS, OC); });
    h += '</div>';
    if (cfg.ocupadas) h += '<div class="rf-leg"><span><i class="rf-sw rf-sw-oc"></i>Ocupado</span><span><i class="rf-sw rf-sw-sel"></i>Tu selección</span></div>';
    if (st.aviso) {
      const a = st.aviso.item;
      h += '<div class="rf-warn" role="alert"><b>Se cruza con otra fecha ocupada</b><span>' + esc(a.etq) + ' · ' + esc(bonita(a.ini)) + ' → ' + esc(bonita(a.fin)) + '</span>' +
        '<div class="rf-wb"><button type="button" class="rf-clr" data-a="otras">Elegir otras</button><button type="button" class="rf-igual" data-a="igual">Usar igual</button></div></div>';
    }
    h += '<div class="rf-foot"><button type="button" class="rf-clr" data-a="clr">Borrar fechas</button><span class="rf-hint">' + esc(cfg.pie || 'Toca el día; se cierra solo.') + '</span></div>';
    panel.innerHTML = h;
    // la navegación con las flechas del mes no debe mover la pantalla debajo
    if (st.aviso) { const ba = panel.querySelector('[data-a=otras]'); if (ba) ba.focus(); }
    else if (foco) enfocarDia(st.foco);
  }

  function mesHTML(mm, L, hoyS, OC) {
    const primero = new Date(Date.UTC(mm.y, mm.m, 1)).getUTCDay(), off = (primero + 6) % 7;
    const dias = new Date(Date.UTC(mm.y, mm.m + 1, 0)).getUTCDate();
    let h = '<div class="rf-m"><h5>' + MES[mm.m] + ' ' + mm.y + '</h5><div class="rf-g" role="grid">';
    SEM7.forEach(w => { h += '<div class="rf-w" aria-hidden="true">' + w + '</div>'; });
    for (let i = 0; i < off; i++) h += '<span></span>';
    for (let d = 1; d <= dias; d++) {
      const f = iso(mm.y, mm.m, d);
      const dis = f < L.min || f > L.max;
      const esSt = f === st.ci, esEn = f === st.co;
      const mid = st.ci && st.co && f > st.ci && f < st.co;
      const oc = OC && OC[f], col = (off + d - 1) % 7;
      let cl = 'rf-d' + (f === hoyS ? ' rf-hoy' : '') + (esSt ? ' rf-st' : '') + (esEn ? ' rf-en' : '') + (mid ? ' rf-mid' : '') + (esSt && st.co && st.co !== st.ci ? ' rf-tieneco' : '') + (oc ? ' rf-oc' : '') + (col === 0 ? ' rf-c0' : '') + (col === 6 ? ' rf-c6' : '');
      const etq = larga(f) + (esSt ? ', ' + cfg.ciEtq : '') + (esEn ? ', ' + cfg.coEtq : '') + (f === hoyS ? ', hoy' : '') + (oc ? ', noche ocupada: ' + oc.etq : '');
      h += '<button type="button" class="' + cl + '" data-d="' + f + '" tabindex="' + (f === st.foco ? '0' : '-1') + '" aria-label="' + esc(etq) + '"' + (oc ? ' title="' + esc(oc.etq) + '"' : '') +
        (esSt || esEn ? ' aria-pressed="true"' : '') + (dis ? ' disabled' : '') + '>' + d + '</button>';
    }
    return h + '</div></div>';
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function enfocarDia(f) {
    let b = panel.querySelector('.rf-d[data-d="' + f + '"]:not([disabled])');
    if (!b) b = panel.querySelector('.rf-d:not([disabled])');
    if (b) { st.foco = b.dataset.d; panel.querySelectorAll('.rf-d[tabindex="0"]').forEach(x => x.tabIndex = -1); b.tabIndex = 0; try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); } }
  }

  function irMes(delta) {
    let m = st.mes.m + delta, y = st.mes.y;
    while (m > 11) { m -= 12; y++; } while (m < 0) { m += 12; y--; }
    const L = limites();
    if ((y * 12 + m) < (parse(L.min).y * 12 + parse(L.min).m)) return;
    if ((y * 12 + m) > (parse(L.max).y * 12 + parse(L.max).m)) return;
    st.mes = { y, m };
  }

  function elegir(d) {
    if (st.etapa !== 'co' || !st.ci || (cfg.inc ? d < st.ci : d <= st.ci)) {
      // primer toque (o un día anterior al check-in: se toma como nuevo check-in)
      st.ci = d; st.co = null; st.etapa = 'co'; st.foco = d; st.aviso = null; st.forzar = false;
      fijar(cfg.ci, d);
      render(true);
      const b = panel.querySelector('.rf-d[data-d="' + d + '"]'); if (b) b.classList.add('rf-pop');
    } else {
      const ch = (cfg.ocupadas && !st.forzar) ? choque(st.ci, d) : null;
      if (ch) { st.aviso = { co: d, item: ch }; st.foco = d; render(false); return; }
      st.forzar = false;
      st.co = d; st.foco = d; st.etapa = 'ok';
      fijar(cfg.co, d);
      render(true);
      const b = panel.querySelector('.rf-d[data-d="' + d + '"]'); if (b) b.classList.add('rf-pop');
      st.cierre = setTimeout(cerrar, 260);
    }
  }

  function clickPanel(e) {
    const t = e.target.closest('button'); if (!t || t.disabled) return;
    if (t.classList.contains('rf-d')) { elegir(t.dataset.d); return; }
    const a = t.dataset.a;
    if (a === 'x') cerrar();
    else if (a === 'prev') { irMes(-1); render(false); const b = panel.querySelector('[data-a="prev"]'); if (b && !b.disabled) b.focus(); }
    else if (a === 'next') { irMes(1); render(false); const b = panel.querySelector('[data-a="next"]'); if (b && !b.disabled) b.focus(); }
    else if (a === 'otras') { st.aviso = null; render(true); }
    else if (a === 'igual') { const d = st.aviso.co; st.aviso = null; st.forzar = true; elegir(d); }
    else if (a === 'sci') { st.etapa = 'ci'; render(false); }
    else if (a === 'sco') { st.etapa = 'co'; render(false); }
    else if (a === 'clr') {
      fijar(cfg.co, ''); fijar(cfg.ci, '');
      st.ci = null; st.co = null; st.etapa = 'ci'; render(false);
    }
  }

  function teclado(e) {
    if (e.key === 'Escape') { e.preventDefault(); cerrar(); return; }
    if (e.key === 'Tab') {
      const f = Array.from(panel.querySelectorAll('button:not([disabled]):not([tabindex="-1"])'));
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
      return;
    }
    const d = e.target.closest && e.target.closest('.rf-d'); if (!d) return;
    const mapa = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
    let nf = null;
    if (mapa[e.key] !== undefined) nf = addDias(d.dataset.d, mapa[e.key]);
    else if (e.key === 'PageDown' || e.key === 'PageUp') { const o = parse(d.dataset.d); const dm = e.key === 'PageDown' ? 1 : -1; let m = o.m + dm, y = o.y; if (m > 11) { m = 0; y++; } if (m < 0) { m = 11; y--; } const mx = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); nf = iso(y, m, Math.min(o.d, mx)); }
    else if (e.key === 'Home') nf = addDias(d.dataset.d, -((new Date(utc(d.dataset.d)).getUTCDay() + 6) % 7));
    else if (e.key === 'End') nf = addDias(d.dataset.d, 6 - ((new Date(utc(d.dataset.d)).getUTCDay() + 6) % 7));
    if (!nf) return;
    e.preventDefault();
    const L = limites(); if (nf < L.min || nf > L.max) return;
    const o = parse(nf), vis = mesesVisibles();
    if (!vis.some(v => v.y === o.y && v.m === o.m)) { st.mes = { y: o.y, m: o.m }; if (o.y * 12 + o.m > vis[0].y * 12 + vis[0].m && vis.length === 2) { /* avanzó: el mes nuevo queda a la derecha */ st.mes = (function () { let m = o.m - 1, y = o.y; if (m < 0) { m = 11; y--; } return { y, m }; })(); } if (o.y * 12 + o.m < vis[0].y * 12 + vis[0].m) st.mes = { y: o.y, m: o.m }; }
    st.foco = nf; render(true);
  }

  window.RangoFechas = { montar, _estado: () => st, _abrir: abrir, _cerrar: cerrar };
})();

if (CFG.url && CFG.clave) { showApp(); call({ accion: 'listar' }).then(j => { aplicar(j); setHint(true); }).catch(e => { msg(String(e.message || e), 'err'); }); }
</script>
</body>
</html>
