<style>
:root{
  --bg:var(--fondo);--surface:var(--tarjeta);--ink:var(--texto);--mut:var(--texto-2);--line:var(--linea);
  --hero1:var(--hero-a);--hero2:var(--hero-b);--hero-mute:#9fc0d3;
  --accent:var(--acento);--accent-t:var(--acento-texto);--accent-ink:#04261a;--accent-bg:color-mix(in srgb,var(--acento) 14%,transparent);
  --warn:var(--pendiente);--warn-bg:color-mix(in srgb,var(--pendiente) 14%,transparent);--info-bg:color-mix(in srgb,var(--texto-2) 14%,transparent);
  --bad:var(--error);
  --shadow:0 1px 2px rgba(10,34,51,.05),0 8px 20px -12px rgba(10,34,51,.2)
}
:root[data-modo="oscuro"]{--shadow:0 1px 2px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root[data-modo="auto"]{--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;padding:20px 16px 48px;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:640px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:14px;min-height:36px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;
  border-radius:24px;padding:22px 20px;box-shadow:0 18px 34px -16px rgba(10,34,51,.7);text-align:center;margin-bottom:18px}
.hero h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:6px 0 0;font-size:13px;color:var(--hero-mute);font-weight:600}

.gate{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow)}
.gate h2{margin:0 0 6px;font-size:16px;font-weight:800}
.gate p{margin:0 0 14px;font-size:13px;color:var(--mut);font-weight:600;line-height:1.5}
.pw{display:flex;gap:8px}
input,select,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;background:var(--bg);color:var(--ink);width:100%;min-height:46px}
textarea{resize:vertical;min-height:72px;line-height:1.45}
input.bad,textarea.bad{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--error) 22%,transparent)}
.btn{appearance:none;border:none;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;min-height:44px;transition:transform .12s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn-acc{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn-edit{background:var(--accent-bg);color:var(--accent-t);border:1px solid var(--accent)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px;min-height:40px}
.btn-bad{background:var(--bad);color:#fff}
.btn svg{width:15px;height:15px;flex:none}
.msg{font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
#app{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800}
.card .hint{margin:0 0 14px;font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.5}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:12.5px;color:var(--mut);font-weight:700}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[readonly]{opacity:.8;cursor:not-allowed}
.small{font-size:12px;color:var(--mut);font-weight:600;margin-top:6px;line-height:1.45}

.codigo{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;background:var(--bg)}
.codigo b{font-size:14px;font-weight:800;overflow-wrap:anywhere}
.codigo span{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}

.alerta{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.alerta.info{border-color:var(--line);background:var(--info-bg)}
.alerta b{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--warn);margin-bottom:6px}
.alerta.info b{color:var(--mut)}
.alerta ul{margin:0;padding-left:18px;font-size:12.5px;font-weight:600;line-height:1.55}
.alerta li.inf{color:var(--mut)}

.chips{display:grid;grid-template-columns:1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{appearance:none;font-family:inherit;font-weight:700;font-size:13px;line-height:1.25;text-align:left;min-height:48px;padding:10px 12px;
  border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:transform .12s,border-color .15s,background .15s,color .15s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-t)}
.chip small{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-top:1px}
.chip.on small{color:var(--accent-t)}
.seg .chip{justify-content:center;text-align:center}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);transition:all .15s}
.chip.on .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}

.tramo{border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px;margin-bottom:12px;background:var(--bg)}
.tramo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:13.5px;font-weight:800}
.tramo-h small{font-size:11.5px;font-weight:700;color:var(--mut);margin-left:6px}
.tramo input,.tramo select{background:var(--surface)}
.noche{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin-bottom:8px}
.noche .nd{font-size:14px;font-weight:700}
.noche .nd small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.noche input{background:var(--surface);text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.chk{border-radius:12px;padding:10px 12px;font-size:13px;font-weight:800;margin:4px 0 12px;border:1px solid var(--line);background:var(--bg)}
.chk.ok{color:var(--ok,#0a7d4b);border-color:currentColor}
.chk.bad{color:var(--bad)}
.link{appearance:none;background:none;border:none;padding:10px 0;margin:0;color:var(--accent-t);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;min-height:44px}
.link.bad{color:var(--bad)}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:stretch}
.stp{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font-family:inherit;font-size:22px;font-weight:800;min-height:48px;cursor:pointer;transition:transform .12s}
.stp:active{transform:scale(.94)}
.stepper input{text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.stat .k{font-size:11.5px;color:var(--mut);font-weight:700}
.stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}

.sticky{position:sticky;bottom:10px;z-index:20;margin-top:12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px -10px rgba(10,34,51,.35)}
.sticky .msg{margin:0 0 8px;min-height:0}
.sticky .msg:empty{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.sticky .btn-acc{flex:1;min-height:48px}
.sticky .btn-ghost{min-height:48px}

.list-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.list-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.list-item b{font-size:14px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent-t);white-space:nowrap}
.list-item .meta{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:4px;line-height:1.55}
.list-item .tot{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.list-item .cmt{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.list-item .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.list-item.flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.empty{font-size:13px;color:var(--mut);font-weight:600;text-align:center;padding:18px 0}
@media (min-width:900px){.wrap{max-width:760px}.chips{grid-template-columns:repeat(3,1fr)}}
@media (max-width:380px){.row2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.apphead{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.backbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:0 0 auto;text-decoration:none;box-shadow:var(--shadow)}
.backbtn:active{transform:scale(.94)}
.backbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.apphead .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block;flex:0 0 auto}
.apphead .ttl{min-width:0}
.apphead .ttl b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.apphead .ttl span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}

.vig{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);margin-bottom:14px}
.vig .k{font-size:12px;color:var(--mut);font-weight:700}
.vig .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.vig .o{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-bg);color:var(--accent-t);white-space:nowrap}
.vig .o.ex{background:var(--warn-bg);color:var(--warn)}
.sec{font-size:12.5px;font-weight:800;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.it .t{font-size:13px;font-weight:700;line-height:1.4;min-width:0}
.it .t small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.it .val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.it .btns{display:flex;gap:8px;width:100%}
.frm{border:1px dashed var(--accent);border-radius:14px;padding:12px 12px 2px;margin:10px 0;background:var(--surface)}
.frm h4{margin:0 0 10px;font-size:13.5px;font-weight:800}
.nada{font-size:12.5px;color:var(--mut);font-weight:600;padding:4px 0 8px}
details summary{cursor:pointer;font-size:12.5px;font-weight:800;color:var(--accent-t);padding:8px 0;min-height:40px;display:flex;align-items:center}
.hist .it{opacity:.85}
.apphead{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.backbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:0 0 auto;text-decoration:none;box-shadow:var(--shadow)}
.backbtn:active{transform:scale(.94)}
.backbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.apphead .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block;flex:0 0 auto}
.apphead .ttl{min-width:0}
.apphead .ttl b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.apphead .ttl span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
@media (min-width:900px){.wrap{max-width:760px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v7: rubros ===== */
.wrap{max-width:640px}
@media (min-width:900px){.wrap{max-width:1040px}}
.cfg{display:block}
@media (min-width:900px){.cfg{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}.cfg nav{position:sticky;top:16px}}
.nv{display:flex;flex-direction:column;gap:6px}
.nvi{appearance:none;font-family:inherit;text-align:left;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:var(--shadow);transition:transform .12s,border-color .15s,background .15s}
.nvi:active{transform:scale(.985)}
.nvi.on{border-color:var(--accent);background:var(--accent-bg)}
.nvi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-bg);display:grid;place-items:center;flex:none}
.nvi .ic svg{width:19px;height:19px;stroke:var(--accent-t);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nvi .tx{flex:1;min-width:0}
.nvi .tx b{display:block;font-size:14.5px;font-weight:800}
.nvi .tx small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
.nvi .ch{color:var(--mut);font-size:20px;flex:none}
.nvh{font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:14px 4px 4px}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.ph h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.pback{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center;flex:none}
.pd{margin:0 0 14px;font-size:13px;color:var(--mut);font-weight:600;line-height:1.5}
.gt{font-size:12px;font-weight:800;color:var(--mut);margin:16px 4px 6px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{appearance:none;font-family:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;display:flex;align-items:center;gap:10px;min-height:60px;padding:11px 14px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--accent-bg)}
.row .rt{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.3}
.row .rt small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.row .rv{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .ch{color:var(--mut);font-size:18px}
.stats{margin-bottom:6px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.cal .hd,.cal .rw{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));gap:4px;align-items:center;padding:11px 12px}
.cal .hd{font-size:11px;font-weight:800;color:var(--mut);border-bottom:1px solid var(--line);background:var(--bg)}
.cal .hd span{text-align:right}
.cal .hd span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:currentColor}
.cal .hd .l1{color:var(--warn)}.cal .hd .l2,.cal .hd .l3{color:var(--accent-t)}.cal .hd .l4{color:var(--accent-t)}
.cal .rw{appearance:none;font-family:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer;min-height:56px}
.cal .rw:last-child{border-bottom:0}
.cal .rw:active{background:var(--accent-bg)}
.cal .rw b{font-size:13.5px;font-weight:800;line-height:1.25}
.cal .rw i{font-style:normal;text-align:right;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.bgs{position:fixed;inset:0;background:rgba(5,15,25,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.bgs.on{opacity:1;pointer-events:auto}
.shx{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));z-index:51;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .25s;box-shadow:0 -12px 40px -12px rgba(0,0,0,.4);max-width:560px;margin:0 auto}
.shx.on{transform:none}
@media (min-width:900px){.shx{bottom:auto;top:50%;border-radius:22px;transform:translateY(-40%) scale(.97);opacity:0;pointer-events:none}.shx.on{transform:translateY(-50%);opacity:1;pointer-events:auto}}
.shx .gr{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.shx h3{margin:0 0 2px;font-size:17px;font-weight:800}
.shx .sd{margin:0 0 14px;font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.45}
.lv{display:flex;align-items:center;gap:6px}
.lv::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lv.l1::before{background:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--surface);font-size:13px;font-weight:700;padding:11px 16px;border-radius:12px;z-index:60;transition:all .25s;max-width:calc(100vw - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}
</style>

<body>
<div class="wrap">
  <header class="apphead">

{ const k0 = getClave(); if (k0) CFG = { url: FIXED_URL, clave: k0 }; }

const fnum = (n, d) => { n = Number(n) || 0; const p = Math.abs(n).toFixed(d == null ? 2 : d).split('.'); return (n < 0 ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : ''); };

}
function showApp() { $('gate').style.display = 'none'; $('app').style.display = 'block'; pintarAirbnb(); }

const RUB = [

  { id: 'inv', t: 'Inversión', s: 'Compra, préstamo y valor', d: 'Datos de la inversión. Alimentan los indicadores de Resultados financieros. Cambia un valor y todo se recalcula; cada cambio queda en el historial.', ic: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>' },

    if (p.unidad === 'MES') v = String(v).replace('-', '');
    t.disabled = true;
    try { aplicar(await call({ accion: 'guardarBase', parametro: k, valor: v, desde: d })); closeSheet(); setHint(true); toast('Guardado. Ya lo usan los demás módulos.'); }
    catch (err) { t.disabled = false; toast(String(err.message || err), true); }
    return;
  }
  if (t.dataset.sc) {
    const ind = t.dataset.sc, cob = ind === 'cobertura', d = $('s_d').value, vals = [];
    for (let i = 1; i <= 4; i++) { const x = $('s_c' + i).value; if (x === '') { toast('Completa los cuatro valores.', true); $('s_c' + i).classList.add('bad'); return; } vals.push(Math.round(parseFloat(x) * (cob ? 100 : 1) * 100) / 100); }
    for (let i = 1; i < 4; i++) if (!(vals[i] > vals[i - 1])) { toast('Cada nivel debe ser mayor que el anterior.', true); return; }
    t.disabled = true;
    try { let j; for (let i = 0; i < 4; i++) j = await call({ accion: 'guardarBase', parametro: 'cal_' + ind + '_' + (i + 1), valor: vals[i], desde: d }); aplicar(j); closeSheet(); setHint(true); toast('Calificación guardada.'); }
    catch (err) { t.disabled = false; toast(String(err.message || err), true); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

$('cards').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const card = t.closest('[data-card]'), k = card && card.dataset.card;
  if (t.dataset.base) { const pp = DATA.parametros[t.dataset.base], hv = pp.hoy && pp.hoy.valor; abierto = { p: t.dataset.base, modo: 'base', v: pp.unidad === 'MES' && hv ? String(Math.floor(hv / 100)) + '-' + String(hv % 100).padStart(2, '0') : (hv == null ? '' : hv) }; render(); const f = $('f_v'); if (f) f.focus(); return; }
  if (t.dataset.nueva) { abierto = { p: t.dataset.nueva, modo: 'exc' }; render(); const f = $('f_d'); if (f) f.focus(); return; }
  if (t.dataset.edit) {
    const x = DATA.parametros[k].excepciones.filter(z => z.id === t.dataset.edit)[0]; if (!x) return;
    abierto = { p: k, modo: 'exc', id: x.id, firma: x.firma, d: x.desde, h: x.hasta, v: x.valor, n: x.nota }; render(); const f = $('f_v'); if (f) f.focus(); return;
  }
  if (t.hasAttribute('data-cancel')) { abierto = null; render(); msg(''); return; }
  if (t.dataset.del) {
    if (t.dataset.armed !== '1') {
      t.dataset.armed = '1'; t.textContent = '¿Seguro? Borrar'; t.classList.remove('btn-ghost'); t.classList.add('btn-bad');
      setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Borrar'; t.classList.add('btn-ghost'); t.classList.remove('btn-bad'); } }, 4000);
      return;
    }
    t.disabled = true; msg('Borrando...');
    try { aplicar(await call({ accion: 'borrarExcepcion', parametro: k, id: t.dataset.del, firma: t.dataset.firma })); setHint(true); msg('Excepción borrada.', 'ok'); }
    catch (err) { t.disabled = false; msg(String(err.message || err), 'err'); }
    return;
  }
  if (t.dataset.ok) {
    let v = $('f_v').value; const d = $('f_d').value; if (DATA.parametros[abierto.p].unidad === 'MES' && v) v = String(v).replace('-', ''); if (v === '') { msg('Escribe el valor.', 'err'); $('f_v').classList.add('bad'); $('f_v').focus(); return; }
    t.disabled = true; msg('Guardando...');
    try {
      const body = t.dataset.ok === 'base' ? { accion: 'guardarBase', parametro: abierto.p, valor: v, desde: d } :
        { accion: 'guardarExcepcion', parametro: abierto.p, id: abierto.id || '', firma: abierto.firma || '', valor: v, desde: d, hasta: $('f_h').value, nota: $('f_n').value };
      aplicar(await call(body)); abierto = null; render(); setHint(true); msg('Guardado. Ya lo usan los demás módulos desde ahora.', 'ok');
    } catch (err) { t.disabled = false; msg(String(err.message || err), 'err'); }
  }
});
document.addEventListener('input', e => { if (e.target && e.target.classList) e.target.classList.remove('bad'); });

if (CFG.url && CFG.clave) { showApp(); call({ accion: 'listar' }).then(j => { aplicar(j); setHint(true); }).catch(e => { msg(String(e.message || e), 'err'); }); }
</script>
</body>
</html>
