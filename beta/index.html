  lastFocus=document.activeElement;$('dim').hidden=false;$('sheet').hidden=false;
  var f=$('shL').querySelector('a');if(f)f.focus();
  $('shL').querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){var t=a.getAttribute('data-reg-go');pendiente=(t==='gasto'||t==='extra')?t:null;cerrarReg(true);});});
}
function cerrarReg(sinFoco){$('dim').hidden=true;$('sheet').hidden=true;if(!sinFoco&&lastFocus&&lastFocus.focus)lastFocus.focus();}
$('dim').addEventListener('click',function(){cerrarReg();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').hidden)cerrarReg();});
document.querySelectorAll('[data-reg]').forEach(function(b){b.addEventListener('click',abrirReg);});

/* ---------- arranque ---------- */
function iniciar(){
  var per=CB.perfil;if(!per)return;
  try{sessionStorage.removeItem('cb_viejo');}catch(e){}
  $('who').textContent=per.nombre+' · '+per.rolEtiqueta;
  buildNav();
  if(!regOpts().length)document.querySelectorAll('[data-reg]').forEach(function(b){b.hidden=true;});
  $('shell').hidden=false;
  bioOfrecer();
  window.addEventListener('hashchange',go);
  if(!location.hash)history.replaceState(null,'','#hoy');
  go();
}
if(window.CB&&CB.ready){CB.ready.then(function(){if(!CB.bloqueado)iniciar();});}
else{CB={perfil:{nombre:'',rolEtiqueta:'',modulos:[]},puede:function(){return true;}};iniciar();}
})();
</script>
