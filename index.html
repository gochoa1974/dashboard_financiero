<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Cima Blanca</title>
<link rel="icon" type="image/png" href="Cima-Blanca-logo.png">
<link rel="apple-touch-icon" href="Cima-Blanca-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf2f4;--surface:#ffffff;--ink:#0a2233;--mut:#5f7080;--line:#dde5ea;
  --hero1:#0a2233;--hero2:#123a52;--hero-mute:#9fc0d3;
  --accent:#0f9d6e;--accent-ink:#ffffff;
  --shadow:0 1px 2px rgba(10,34,51,.05),0 8px 20px -12px rgba(10,34,51,.2)
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#071722;--surface:#0e2536;--ink:#eaf2f6;--mut:#8fa6b5;--line:#1a3649;
    --hero1:#0f3550;--hero2:#14506b;--hero-mute:#9fc0d3;
    --accent:#2fd49a;--accent-ink:#04231a;
    --shadow:0 1px 2px rgba(0,0,0,.4)
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:420px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;
  border-radius:24px;padding:28px 24px 26px;box-shadow:0 18px 34px -16px rgba(10,34,51,.7);text-align:center;margin-bottom:22px}
.hero img{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;
  box-shadow:0 2px 10px -4px rgba(0,0,0,.35)}
.hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:6px 0 0;font-size:13px;color:var(--hero-mute);font-weight:600}
.menu{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:16px 16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
  transition:transform .12s}
.card:active{transform:scale(.98)}
.tile{width:48px;height:48px;border-radius:14px;background:rgba(15,157,110,.12);display:grid;place-items:center;
  flex:0 0 auto}
.tile svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8}
.card .txt b{display:block;font-size:15.5px;font-weight:800}
.card .txt span{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.card .arr{margin-left:auto;color:var(--mut);flex:0 0 auto}
.foot{text-align:center;margin-top:20px;font-size:11.5px;color:var(--mut);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="Cima-Blanca-logo.png" alt="Cima Blanca">
    <h1>Cima Blanca</h1>
    <p>Punta Blanca · Santa Elena, Ecuador</p>
  </div>
  <div class="menu">
    <a class="card" href="dashboard/">
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19V13M22 19H2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt"><b>Dashboard</b><span>Gastos e ingresos</span></div>
      <div class="arr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>
    <a class="card" href="https://gochoa1974.github.io/Cima-Blanca/admin.html">
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt"><b>Panel de Anfitrión</b><span>Generar enlace para huésped</span></div>
      <div class="arr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>
  </div>
  <div class="foot">Cima Blanca · Panel privado del propietario</div>
</div>
</body>
</html>
