<style>
:root{
  --bg:#edf2f4;--surface:#ffffff;--ink:#0a2233;--mut:#5f7080;--line:#dde5ea;
  --hero1:#0a2233;--hero2:#123a52;--hero-mute:#9fc0d3;
  --rec:#0f9d6e;--ev:#6b8cff;--pen:#f0a93b;
  --ok:#0b7a55;--ok-bg:#e1f4ec;--warn:#a85a07;--warn-bg:#fdf1d8;--warn-line:#f1d9a3;--off:#56677a;--off-bg:#e8eef2;
  --bad:#c2303a;--bad-bg:#fdecee;
  --accent:#0f9d6e;--accent-ink:#ffffff;--tabs:#e3eaee;--tabon:#ffffff;
  --shadow:0 1px 2px rgba(10,34,51,.05),0 8px 20px -12px rgba(10,34,51,.2)
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#071722;--surface:#0e2536;--ink:#eaf2f6;--mut:#8fa6b5;--line:#1a3649;
    --hero1:#0f3550;--hero2:#14506b;--hero-mute:#9fc0d3;
    --rec:#2fd49a;--ev:#8ba5ff;--pen:#f5b95f;
    --ok:#4fdc9c;--ok-bg:#0f3a30;--warn:#f3b95f;--warn-bg:#3a2c12;--warn-line:#6e4f1d;--off:#a3b6c4;--off-bg:#173345;
    --bad:#ff7b84;--bad-bg:#3d1a20;
    --accent:#2fd49a;--accent-ink:#04231a;--tabs:#0a1b28;--tabon:#24425a;
    --shadow:0 1px 2px rgba(0,0,0,.4)
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
body.lock{overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
input,select{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:52px;height:52px;border-radius:50%;flex:0 0 auto;display:block;box-shadow:0 2px 10px -4px rgba(10,34,51,.35)}
.who div b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.who div span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:8px 12px;border-radius:99px;border:0;min-height:36px;max-width:60%;text-align:left;line-height:1.2}
.sync i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.sync.ok{background:var(--ok-bg);color:var(--ok)}
.sync.off,.sync.busy,.sync.pend{background:var(--off-bg);color:var(--off)}
.sync.err{background:var(--bad-bg);color:var(--bad)}
.sync.busy i,.sync.pend i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
.month .nav{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink);box-shadow:var(--shadow);flex:0 0 auto}
.month .nav:active{transform:scale(.94)}
.mid-m{flex:1;text-align:center;min-width:0}
.mid-m b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.hoy{margin-top:3px;border:0;background:var(--off-bg);color:var(--off);font-size:12px;font-weight:700;border-radius:99px;padding:5px 12px;min-height:28px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:22px 22px 20px;box-shadow:0 18px 34px -16px rgba(10,34,51,.7)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;box-shadow:0 0 0 30px rgba(255,255,255,.035),0 0 0 62px rgba(255,255,255,.022)}
.hero>*{position:relative;z-index:1}
.hero-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-mute);font-weight:700}
.hero-big{font-size:50px;line-height:1.05;font-weight:800;letter-spacing:-.035em;margin:8px 0 4px}
.hero-big small{font-size:27px;font-weight:700;opacity:.65;margin-right:3px;letter-spacing:0}
.hero-s{font-size:14px;color:var(--hero-mute);font-weight:600}
.hero-s2{font-size:12.5px;color:var(--hero-mute);font-weight:600;margin-top:3px}
.hero-row{display:flex;align-items:center;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14)}
.ring{position:relative;width:78px;height:78px;flex:0 0 auto}
.ring svg{display:block;width:78px;height:78px;transform:rotate(-90deg);fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.16)}
.ring .fg{stroke:#4ade9f;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800;letter-spacing:-.02em}
.hero-txt b{display:block;font-size:15px;font-weight:700}
.hero-txt span{display:block;font-size:13px;color:var(--hero-mute);font-weight:600;margin-top:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 11px;box-shadow:var(--shadow);min-width:0}
.kpi small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);font-weight:700}
.kpi small i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.kpi b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:5px;white-space:nowrap}
.kpi.pen b{color:var(--warn)}
.banner{margin:12px 16px 0;padding:11px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:700;line-height:1.4}
.sticky{position:sticky;top:0;z-index:3;padding:10px 16px 8px;margin-top:10px;background:linear-gradient(var(--bg) 80%,transparent)}
.tabs{display:flex;gap:4px;background:var(--tabs);border-radius:14px;padding:4px}
.tabs button{flex:1;min-height:44px;border:none;background:transparent;border-radius:11px;padding:0 6px;font-size:14px;font-weight:700;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:var(--tabon);color:var(--ink);box-shadow:0 1px 3px rgba(10,34,51,.16)}
.tabs em{font-style:normal;font-weight:700;font-size:11.5px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--off-bg);color:var(--mut)}
.tabs button.on em{background:var(--ink);color:var(--surface)}
.pane{display:none;padding:0 16px}
.pane.on{display:block}
.group{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 2px 10px}
.group span{letter-spacing:0;font-size:13px;white-space:nowrap}
.item{width:100%;text-align:left;display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:9px;min-height:68px;box-shadow:var(--shadow);transition:transform .12s}
.item:active{transform:scale(.985)}
.item.sug{border-color:var(--warn-line)}
.tile{position:relative;width:44px;height:44px;border-radius:14px;background:var(--off-bg);display:grid;place-items:center;font-size:21px;flex:0 0 auto}
.tile::after{content:"";position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;background:var(--rec);border:2.5px solid var(--surface)}
.item.ev .tile::after{background:var(--ev)}
.item.sug .tile{background:var(--warn-bg)}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rec);flex:0 0 auto;display:inline-block}
.dot.ev{background:var(--ev)}
.right{text-align:right;flex:0 0 auto}
.amt{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:5px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.off{background:var(--off-bg);color:var(--off)}
.confirm{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:none;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;margin:6px 0 2px;box-shadow:0 10px 20px -12px var(--accent);transition:transform .12s}
.confirm:active{transform:scale(.985)}
.addrec{width:100%;min-height:50px;margin-top:6px;border:1.5px dashed var(--line);background:transparent;color:var(--mut);border-radius:16px;font-size:14px;font-weight:700}
.alldone{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--ok-bg);color:var(--ok);font-size:14px;font-weight:700;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 13px;margin-top:14px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;gap:10px}
.panel-h b{font-size:14px;font-weight:700}
.panel-h span{font-size:13px;font-weight:800}
.split{display:flex;gap:3px;height:12px}
.split i{display:block;height:100%;border-radius:99px;transition:flex-grow .6s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:18px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--mut);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tots{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
.tots div{display:flex;justify-content:space-between;gap:12px}
.tots b{color:var(--ink);font-weight:800}
.seg{display:flex;gap:4px;padding:4px;background:var(--tabs);border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--tabon);color:var(--ink);box-shadow:0 1px 3px rgba(10,34,51,.16)}
.pane .seg{margin-top:14px}
.empty{text-align:center;color:var(--mut);font-size:14px;font-weight:600;padding:40px 20px;line-height:1.5}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;min-height:58px;border:none;border-radius:18px;background:var(--ink);color:var(--surface);font-size:16px;font-weight:800;box-shadow:0 16px 30px -12px rgba(10,34,51,.7);z-index:4}
.fab:active{transform:translateX(-50%) scale(.985)}
.scrim{position:fixed;inset:0;background:rgba(5,16,24,.55);opacity:0;pointer-events:none;transition:opacity .22s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,100%);background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;max-height:92vh;overflow:auto;z-index:6;visibility:hidden}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{font-size:20px;font-weight:800;letter-spacing:-.02em;min-width:0}
.x{width:40px;height:40px;border-radius:12px;border:0;background:var(--off-bg);font-size:15px;color:var(--mut);flex:0 0 auto}
.money{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:18px 0 14px}
.money span{font-size:34px;font-weight:700;color:var(--mut)}
.money input{width:62%;min-width:0;border:0;background:transparent;color:var(--ink);font-size:54px;font-weight:800;letter-spacing:-.04em;outline:none;font-variant-numeric:tabular-nums}
.money input::placeholder{color:var(--line)}
.shnote{font-size:13px;font-weight:600;color:var(--mut);line-height:1.5;background:var(--off-bg);border-radius:14px;padding:11px 14px;margin-bottom:14px}
.shnote b{color:var(--ink);font-weight:800}
.shnote b.bad{color:var(--bad)}
.shnote b.warnt{color:var(--warn)}
.shnote:empty{display:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:7px}
.field input[type=text],.field input[type=date],.field input[type=password],.field select{width:100%;min-height:50px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:0 14px;font-size:16px;font-weight:600;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.pw{position:relative}
.pw input{padding-right:84px!important}
.eye{position:absolute;right:6px;top:6px;height:38px;border:0;border-radius:10px;background:var(--off-bg);color:var(--off);font-size:12.5px;font-weight:700;padding:0 12px}
.ask{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:13px;font-weight:600;line-height:1.4}
.ask b{font-weight:800}
.ask>span:last-child{display:flex;gap:6px;flex-wrap:wrap}
.ask button{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--warn-line);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:700}
.famtag{font-size:13px;font-weight:600;color:var(--mut);background:var(--off-bg);border-radius:14px;padding:11px 14px;margin-bottom:14px}
.famtag b{color:var(--ink);font-weight:800}
.hintx{font-size:12.5px;font-weight:600;color:var(--mut);margin:-4px 0 12px;min-height:16px;line-height:1.4}
.regname{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.regname b{display:block;font-size:15px;font-weight:700}
.regname span{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.save{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:800;margin-top:4px}
.save:disabled{opacity:.4}
.ghost2{width:100%;min-height:50px;margin-top:10px;border:1px solid var(--line);background:transparent;border-radius:16px;font-size:14.5px;font-weight:700;color:var(--ink)}
.danger{width:100%;min-height:50px;margin-top:10px;border:0;background:var(--bad-bg);border-radius:16px;font-size:14.5px;font-weight:700;color:var(--bad)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-130px);background:var(--ink);color:var(--surface);font-size:14px;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 12px 28px -10px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:30;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast.on{transform:translate(-50%,0)}
.toast button{border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:800;min-height:32px;padding:0 4px;white-space:nowrap}
.gate{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,var(--hero1),var(--hero2));display:none;align-items:center;justify-content:center;padding:24px}
.gate.on{display:flex}
.gcard{width:100%;max-width:400px;background:var(--surface);border-radius:28px;padding:28px 24px 22px;box-shadow:0 30px 60px -24px rgba(0,0,0,.6);text-align:center}
.glogo{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:block;box-shadow:0 4px 16px -6px rgba(10,34,51,.4)}
.gcard h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.gcard p{font-size:13.5px;font-weight:600;color:var(--mut);line-height:1.5;margin:8px 0 18px}
.gcard .pw{text-align:left}
.gcard .pw input{width:100%;min-height:54px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:0 14px;font-size:17px;font-weight:600}
.gmsg{min-height:20px;margin:10px 0 6px;font-size:13px;font-weight:700;color:var(--bad);line-height:1.4}
.link{margin-top:10px;border:0;background:transparent;color:var(--mut);font-size:13.5px;font-weight:700;min-height:40px;padding:0 12px}
@media (min-width:760px){
.app{max-width:1000px;padding-bottom:130px}
.top{padding:calc(22px + env(safe-area-inset-top,0px)) 24px 0}
.head{padding-bottom:16px}
.month{justify-content:flex-start;gap:14px;margin:0 0 16px}
.mid-m{flex:0 1 auto;text-align:left;display:flex;align-items:center;gap:12px}
.mid-m b{font-size:22px}
.hoy{margin-top:0}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:stretch}
.hero{padding:28px 28px 24px}
.hero-big{font-size:62px}
.hero-row{margin-top:26px}
.kpis{grid-template-columns:1fr;grid-auto-rows:1fr;margin:0;gap:12px}
.kpi{padding:16px 20px;display:flex;flex-direction:column;justify-content:center}
.kpi small{font-size:13px}
.kpi b{font-size:26px;margin-top:6px}
.banner{margin:14px 24px 0}
.sticky{padding:12px 24px 8px;margin-top:14px}
.tabs{max-width:560px}
.pane{padding:0 24px}
.pane.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;align-content:start}
.pane>*{min-width:0}
.pane>.group,.pane>.confirm,.pane>.alldone,.pane>.addrec,.pane>.panel,.pane>.seg,.pane>.empty{grid-column:1/-1}
.pane>.confirm,.pane>.addrec,.pane>.seg{max-width:460px}
.pane>.panel{max-width:100%}
.fab{left:auto;right:max(24px,calc((100vw - 1000px)/2 + 24px));transform:none;width:auto;min-width:250px;padding:0 32px}
.fab:active{transform:scale(.985)}
.sheet{top:50%;bottom:auto;max-width:520px;border-radius:26px;padding:20px 28px 28px;max-height:88vh;transform:translate(-50%,-46%);opacity:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .25s}
.sheet.on{transform:translate(-50%,-50%);opacity:1;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s}
.grab{display:none}
.toast{top:24px}
}
@media (min-width:1200px){
.app{max-width:1180px}
.pane.on{grid-template-columns:repeat(3,minmax(0,1fr))}
.fab{right:max(24px,calc((100vw - 1180px)/2 + 24px))}
}
@media (hover:hover){
.item:hover{border-color:var(--accent)}
.fab:hover,.save:hover,.confirm:hover{filter:brightness(1.08)}
.tabs button:hover,.seg button:hover,.nav:hover,.ghost2:hover,.addrec:hover{filter:brightness(.97)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function tendenciaLuz(DS){
 const rows=[...DS].filter(e=>e.concepto==='Luz'&&e.monto>0&&e.mes<MES).sort((a,b)=>(a.mes+a.fecha).localeCompare(b.mes+b.fecha));
 const porMes=new Map(); rows.forEach(r=>porMes.set(r.mes,(porMes.get(r.mes)||0)+r.monto));
 const serie=[...porMes.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
 if(serie.length<2)return serie.length?{monto:serie[serie.length-1][1],metodo:'único mes disponible ('+mShort(serie[serie.length-1][0])+')'}:null;
 const last=serie.slice(-4);
 const xs=last.map((_,i)=>i), ys=last.map(r=>r[1]);
 const n=xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
 const sxy=xs.reduce((a,x,i)=>a+x*ys[i],0), sxx=xs.reduce((a,x)=>a+x*x,0);
 const den=(n*sxx-sx*sx);
 const slope=den?(n*sxy-sx*sy)/den:0, inter=(sy-slope*sx)/n;
 let est=slope*n+inter;
 const avg=sy/n;
 const rango=slope>0.05?'subiendo':(slope<-0.05?'bajando':'estable');
 if(est<avg*0.5||est>avg*1.8||isNaN(est))est=avg;
 return {monto:Math.max(0,Math.round(est*100)/100),metodo:'tendencia '+rango+' de los últimos '+n+' meses ('+last.map(x=>f2(x[1])).join(' → ')+')'};

}
const FLDS=['id','fecha','mes','anuncio','concepto','familia','cuenta','etiqueta','detalle','monto','estado','medio','doc','origen','editado'];
function wire(e){const r={};FLDS.forEach(k=>{let v=e[k];if(v===undefined||v==='')v=null;r[k]=v;});r.monto=Math.round((Number(e.monto)||0)*100)/100;r.editado=!!e.editado;return r;}
const canon=e=>JSON.stringify(wire(e));
function snap(list){const o={};list.forEach(e=>{o[e.id]=canon(e);});return o;}
function saveSync(){try{localStorage.setItem(SYNKEY,JSON.stringify(SYNCED));localStorage.setItem(BASEKEY,JSON.stringify(BASE));}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFGKEY,JSON.stringify(CFG));}catch(e){}}
const connected=()=>!!(CFG.url&&CFG.clave);
function pendingDiff(){
 const DS=dataset(),cur=snap(DS);
 const S=SYNCED||{};
 return {cur,up:DS.filter(e=>S[e.id]!==cur[e.id]).map(wire),del:Object.keys(S).filter(id=>!(id in cur))};
}
function pendCount(){if(!connected()||SYNCED===null)return 0;const d=pendingDiff();return d.up.length+d.del.length;}
function setSync(k,msg){
 syncSt={k,msg:msg||''};
 const n=pendCount();
 const hh=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
 let txt='Sin conectar',cls='off';
 if(k==='ok'){txt='Guardado · '+hh();cls='ok';}
 else if(k==='busy'){txt='Sincronizando…';cls='busy';}
 else if(k==='pend'){txt='Enviando…';cls='pend';}
 else if(k==='err'){txt='⚠ '+(msg||'Sin conexión')+(n?' · '+n+' pendiente'+(n===1?'':'s'):'');cls='err';}
 const b=$('syncPill');b.className='sync '+cls;b.innerHTML='<i></i>'+esc(txt);
 const m=k==='err'?(msg||'Sin conexión'):(k==='ok'?'Todo al día con tu Sheet.':'');
 const cm=$('cfgMsg');if(cm)cm.textContent=m;
 if(k==='err'&&/clave/i.test(msg||'')){CFG={};saveCfg();SYNCED=null;saveSync();showGate(msg);}
 else if(k==='err'&&gateOpen())$('gateMsg').textContent=msg||'Sin conexión';
 if(k!=='busy'&&k!=='pend'){const gb=$('gateGo');gb.disabled=false;gb.textContent='Conectar';}
 if(k==='ok'){
  hideGate();
  if(JUSTCONN){JUSTCONN=false;setTimeout(()=>{if(SH&&SH.t==='cfg')closeSheet();},1200);}
 }
}

async function api(body){
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);
 try{
  const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({clave:CFG.clave,...body}),signal:ctl.signal});
  if(!r.ok)throw new Error('El Sheet no respondió (código '+r.status+')');
  let j;try{j=await r.json();}catch(e){throw new Error('Respuesta inesperada: revisa que la URL sea la de la aplicación web');}
  if(!j.ok)throw new Error(j.error||'El Sheet respondió con error');
  return j;
 }finally{clearTimeout(to);}
}
const normRow=r=>wire(r);
async function firstConnect(){
 const j=await api({accion:'listar'});setHipo(j.hipoteca);
 if(OPS.length&&!confirm('En este dispositivo hay '+OPS.length+' cambio'+(OPS.length===1?'':'s')+' guardado'+(OPS.length===1?'':'s')+' solo aquí.\n\nAceptar = subirlos a tu hoja.\nCancelar = descartarlos y quedarme solo con lo que ya está en la hoja.')){OPS=[];persistOnly();}
 if(j.filas.length){BASE=j.filas.map(normRow);SYNCED=snap(BASE);}
 else{BASE=null;SYNCED={};}
 saveSync();
}
async function pushDiff(){
 const d=pendingDiff();
 if(!d.up.length&&!d.del.length)return 0;
 await api({accion:'sincronizar',upserts:d.up,borrar:d.del});
 SYNCED=d.cur;saveSync();return d.up.length+d.del.length;
}
async function pullAll(){
 const j=await api({accion:'listar'});setHipo(j.hipoteca);
 BASE=j.filas.map(normRow);OPS=[];persistOnly();SYNCED=snap(BASE);saveSync();lastPull=Date.now();
 if(!hasPending())UI={};renderAll();
}
async function sync(opt){
 opt=opt||{};
 if(!connected()){setSync('off');return;}
 if(syncBusy){syncAgain=true;return;}
 syncBusy=true;setSync('busy');
 try{
  let first=false;
  if(SYNCED===null){await firstConnect();first=true;}
  await pushDiff();
  const typing=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(opt.pull&&!first&&!SH&&!typing&&!pendCount())await pullAll();
  setSync('ok');renderAll();
 }catch(e){
  const off=(e&&(e.name==='AbortError'||e instanceof TypeError));
  setSync('err',off?'Sin conexión':(e&&e.message)||'Error');
 }finally{
  syncBusy=false;
  if(syncAgain){syncAgain=false;scheduleFlush();}
 }
}
function scheduleFlush(){if(!connected())return;clearTimeout(ftimer);setSync('pend');ftimer=setTimeout(()=>sync({}),450);}
$('mPrev').onclick=()=>goMonth(addM(MES,-1));
$('mNext').onclick=()=>goMonth(addM(MES,1));
$('mHoy').onclick=()=>goMonth(todayISO().slice(0,7));
document.querySelector('.tabs').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
 document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
 b.classList.add('on');
 $(b.dataset.t==='rec'?'recRows':b.dataset.t==='ev'?'evBox':'regBox').classList.add('on');
});
$('recRows').addEventListener('click',e=>{
 if(e.target.closest('#accAll')){confirmSug();return;}
 if(e.target.closest('#addRecBtn')){openNewRec();return;}
 const it=e.target.closest('.item[data-k]');if(it)openRec(it.dataset.k);
});
$('evBox').addEventListener('click',e=>{const it=e.target.closest('.item[data-id]');if(it)openReg(it.dataset.id);});
$('regBox').addEventListener('click',e=>{
 const sg=e.target.closest('#regSeg button');
 if(sg){REGF=sg.dataset.f;renderReg();return;}
 const it=e.target.closest('.item[data-id]');if(it)openReg(it.dataset.id);
});
$('fab').onclick=openNv;
$('shClose').onclick=closeSheet;
$('scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&SH)closeSheet();
 if(e.key==='Enter'&&gateOpen()&&e.target.id==='gateKey')gateGo();
});
$('syncPill').onclick=openCfg;
$('gateGo').onclick=gateGo;
eyeToggle($('gateKey'),$('gateEye'));
$('gateSkip').onclick=()=>{hideGate();setSync('off');};
window.addEventListener('online',()=>sync({pull:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&connected()&&Date.now()-lastPull>120000)sync({pull:true});});
setInterval(()=>{if(syncSt.k==='err'&&connected())sync({});},60000);
nvReset();setHint();renderAll();
if(connected()){hideGate();sync({pull:true});}else{showGate();setSync('off');}

</script>
