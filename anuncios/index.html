<head>

<title>Anuncios · Cima Blanca</title>

<link rel="apple-touch-icon" href="../Cima-Blanca-logo.png">

<!-- v1 (10 nov 2026 13:30): módulo «Anuncios». Homologa el nombre publicado de Airbnb a uno de los 3 anuncios fijos (LST-01 · 6 pax, LST-02 · 8 pax, LST-03 · 4 pax). Lee y escribe en la hoja HOMOLOGACION_LISTINGS (Apps Script de Parámetros v7). Nunca asigna solo. Permiso: el mismo de Configuración. -->
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:14px/1.45 var(--fuente);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.back{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--texto);font-size:20px}
.top b{font-size:15px}.top small{display:block;color:var(--texto-2);font-size:12px}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:var(--r4);padding:18px 20px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}.hero p{margin:4px 0 0;font-size:13px;opacity:.85}
.badge{min-width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.badge.ok{background:var(--acento);color:#04261a}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r3);padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2);font-weight:800}
.nm{font-size:16px;font-weight:800;overflow-wrap:anywhere;text-wrap:balance}
.facts{font-size:13px;color:var(--texto-2);font-weight:600}
.q{font-weight:700;font-size:14px}
.al{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.al{grid-template-columns:1fr}}
.a{min-height:56px;border:1.5px solid var(--linea);border-radius:14px;background:var(--tarjeta);color:var(--texto);font:inherit;text-align:left;padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.a:hover{border-color:var(--acento)}
.a i{width:20px;height:20px;border-radius:50%;border:2px solid var(--texto-2);flex:none}
.a b{display:block;font-size:14px}.a span{font-size:12px;color:var(--texto-2)}
.a[aria-checked="true"]{border-color:var(--acento);background:color-mix(in srgb,var(--acento) 14%,transparent)}
.a[aria-checked="true"] i{border-color:var(--acento);background:radial-gradient(var(--acento) 45%,transparent 50%)}
.a[disabled]{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;background:color-mix(in srgb,var(--texto-2) 16%,transparent);color:var(--texto-2);white-space:nowrap}
.tag.w{background:color-mix(in srgb,var(--pendiente) 18%,transparent);color:var(--pendiente)}
.tag.k{background:color-mix(in srgb,var(--acento) 16%,transparent);color:var(--acento-texto)}
.note{border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--texto-2) 12%,transparent);color:var(--texto-2);margin-top:12px}
.note.w{background:color-mix(in srgb,var(--pendiente) 16%,transparent);color:var(--pendiente)}
.note.k{background:color-mix(in srgb,var(--acento) 14%,transparent);color:var(--acento-texto)}
.note.b{background:color-mix(in srgb,var(--error) 14%,transparent);color:var(--error)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
.row:first-of-type{border-top:0}.row>div{min-width:0}.row small{display:block;color:var(--texto-2);font-size:12px}.row b{overflow-wrap:anywhere}
.cat{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
@media(max-width:560px){.cat{grid-template-columns:1fr}}
input.dn{min-height:44px;border-radius:12px;border:1.5px solid var(--linea);background:var(--fondo);color:var(--texto);font:inherit;font-size:16px;padding:0 12px;width:100%;min-width:0}
.ghost{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--linea);background:transparent;color:var(--texto);font:inherit;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--texto);color:var(--fondo);padding:8px 8px 8px 16px;border-radius:14px;font-weight:700;z-index:9;max-width:92vw;display:flex;gap:10px;align-items:center}
.toast button{min-height:44px;padding:0 14px;border-radius:10px;border:0;background:var(--acento);color:#04261a;font:inherit;font-weight:800;cursor:pointer}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../dashboard/" aria-label="Volver al dashboard">‹</a><div><b>Cima Blanca</b><small>Configuración</small></div></div>
  <div id="app" aria-live="polite"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function () {
  var L = window.ListingsCB, D = null, cargando = true, err = '', abierto = '', ocupado = false, UNDO = null;
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function $(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fb(iso) { if (!iso) return ''; var x = String(iso).split('-'); return +x[2] + ' ' + MES[+x[1] - 1] + ' ' + x[0]; }
  function lab(v) { var a = anun(v); return a ? a.alias + ' · ' + a.cap + ' pax' : ''; }
  function anun(v) { return (D && D.anuncios || L.BASE).filter(function (a) { return a.v === v; })[0]; }
  function toast(m, undo) { var t = $('toast'); t.innerHTML = '<span>' + esc(m) + '</span>' + (undo ? '<button type="button" data-undo="1">Deshacer</button>' : ''); t.hidden = false; clearTimeout(toast.x); toast.x = setTimeout(function () { t.hidden = true; UNDO = null; }, 6000); }
  function facts(x) {
    var p = [];
    p.push(x.reservas ? x.reservas + ' reserva' + (x.reservas > 1 ? 's' : '') : 'Sin reservas registradas aún');
    if (x.desde) p.push(x.desde === x.hasta || !x.hasta ? fb(x.desde) : fb(x.desde) + ' → ' + fb(x.hasta));
    return p.join(' · ');
  }
  function botones(x, actual) {
    return '<div class="al" role="radiogroup" aria-label="Anuncio para ' + esc(x.nombre) + '">' + (D.anuncios).map(function (a) {
      return '<button type="button" class="a" role="radio" aria-checked="' + (actual === a.v) + '"' + (ocupado ? ' disabled' : '') + ' data-n="' + esc(x.nombre) + '" data-v="' + esc(a.v) + '" data-antes="' + esc(x.alias) + '"><i></i><div><b>' + esc(a.nombre) + '</b><span>' + esc(a.alias) + ' · ' + a.cap + ' pax</span></div></button>';
    }).join('') + '</div>';
  }
  function pintar() {
    var h = '';
    if (cargando && !D) { $('app').innerHTML = '<div class="hero"><div><h1>Anuncios</h1><p>Leyendo el catálogo…</p></div></div>'; return; }
    if (!D) { $('app').innerHTML = '<div class="hero"><div><h1>Anuncios</h1><p>No se pudo abrir el catálogo.</p></div></div><div class="note b">' + esc(err || 'Sin conexión') + '</div><div class="card"><button type="button" class="ghost" data-reintentar="1">Reintentar</button></div>'; return; }
    var pend = D.nombres.filter(function (x) { return !x.alias; }).sort(function (a, b) { return b.reservas - a.reservas; });
    var homo = D.nombres.filter(function (x) { return x.alias; });
    h += '<div class="hero"><div><h1>Anuncios por homologar</h1><p>Airbnb cambia los nombres. Tú solo dices a cuál de tus 3 anuncios pertenece cada uno.</p></div><div class="badge' + (pend.length ? '' : ' ok') + '" aria-label="' + pend.length + ' pendientes">' + (pend.length ? pend.length : '✓') + '</div></div>';
    if (err) h += '<div class="note b">' + esc(err) + '</div>';
    if (pend.length) h += '<div class="note w">Mientras un nombre no esté homologado, sus reservas suman en los totales del departamento pero no en los KPIs por anuncio, y Adicionales te preguntará el anuncio.</div>';
    else h += '<div class="note k">Todo homologado. Si Airbnb cambia un nombre, aparecerá aquí después de sincronizar.</div>';
    pend.forEach(function (x) {
      h += '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="nm">' + esc(x.nombre) + '</div><span class="tag w">Por homologar</span></div><div class="facts">' + esc(facts(x)) + '</div><div class="q">¿A cuál anuncio corresponde?</div>' + botones(x, '') + '</div>';
    });
    h += '<div class="card"><h2>Tus 3 anuncios</h2>' + D.anuncios.map(function (a) {
      return '<div class="cat"><b>' + esc(a.alias) + ' · ' + a.cap + ' pax</b><label><span style="position:absolute;left:-9999px">Nombre para mostrar de ' + esc(a.alias) + '</span><input class="dn" data-dn="' + esc(a.v) + '" value="' + esc(a.nombre) + '" maxlength="40"></label></div>';
    }).join('') + '<div class="facts">El nombre para mostrar lo cambias cuando quieras. Los datos siempre se guardan con el código y la capacidad.</div></div>';
    h += '<div class="card"><h2>Nombres ya homologados (' + homo.length + ')</h2>' + D.anuncios.map(function (a) {
      var l = homo.filter(function (x) { return x.alias === a.v; });
      if (!l.length) return '';
      return '<div class="q" style="margin-top:6px">' + esc(a.nombre) + ' · ' + esc(a.alias) + ' · ' + a.cap + ' pax</div>' + l.map(function (x) {
        var ab = abierto === x.nombre;
        return '<div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>' + esc(x.nombre) + '</b><small>' + esc(facts(x)) + '</small></div><button type="button" class="ghost" data-cambiar="' + esc(x.nombre) + '" aria-expanded="' + ab + '">' + (ab ? 'Cerrar' : 'Cambiar') + '</button>' + (ab ? '<div style="flex-basis:100%">' + botones(x, x.alias) + '</div>' : '') + '</div>';
      }).join('');
    }).join('') + '</div>';
    $('app').innerHTML = h;
  }
  function carga() {
    cargando = true; err = ''; pintar();
    return L.cargar().then(function (d) { D = d; }, function (e) { err = e && e.message || String(e); if (!D) D = L.datos(); }).then(function () { cargando = false; pintar(); });
  }
  function asignar(nombre, v, antes, deshacer) {
    ocupado = true; err = ''; pintar();
    return L.homologar(nombre, v, antes, deshacer).then(function (d) {
      D = d; abierto = '';
      if (deshacer) { toast('Se deshizo: «' + nombre + '» vuelve a «Por homologar»'); UNDO = null; }
      else { UNDO = { nombre: nombre, v: v }; toast('«' + nombre + '» → ' + lab(v), true); }
    }, function (e) { err = e && e.message || String(e); }).then(function () { ocupado = false; pintar(); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.undo && UNDO) { var u = UNDO; asignar(u.nombre, '', u.v, true); return; }
    if (b.dataset.reintentar) { carga(); return; }
    if (b.dataset.cambiar) { abierto = abierto === b.dataset.cambiar ? '' : b.dataset.cambiar; pintar(); return; }
    if (b.dataset.n !== undefined && !ocupado) { if (b.dataset.v === b.dataset.antes) return; asignar(b.dataset.n, b.dataset.v, b.dataset.antes, false); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.dn) return;
    var v = el.value.replace(/\s+/g, ' ').trim(); if (!v) { pintar(); return; }
    L.renombrar(el.dataset.dn, v).then(function (d) { D = d; err = ''; toast('Nombre guardado'); pintar(); }, function (er) { err = er && er.message || String(er); pintar(); });
  });
  pintar();
  Promise.resolve(window.CB && window.CB.ready).then(function () { if (window.CB && window.CB.bloqueado) return; carga(); });
})();
</script>
</body>
</html>
