<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a2233">
<title>Ingresos · Cima Blanca</title>
<link rel="icon" type="image/png" href="../Cima-Blanca-logo.png">
<link rel="apple-touch-icon" href="../Cima-Blanca-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf2f4;--surface:#ffffff;--ink:#0a2233;--mut:#5f7080;--line:#dde5ea;
  --hero1:#0a2233;--hero2:#123a52;--hero-mute:#9fc0d3;
  --air:14,143,163;--dir:194,71,138;--ext:138,154,31;
  --ok:#0b7a55;--ok-bg:#e1f4ec;--warn:#a85a07;--warn-bg:#fdf1d8;--warn-line:#f1d9a3;--off:#56677a;--off-bg:#e8eef2;
  --bad:#c2303a;--bad-bg:#fdecee;--info:#1d5fa8;--info-bg:#e4effb;
  --accent:#0e8fa3;--accent-ink:#ffffff;--tabs:#e3eaee;--tabon:#ffffff;
  --shadow:0 1px 2px rgba(10,34,51,.05),0 8px 20px -12px rgba(10,34,51,.2)
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#071722;--surface:#0e2536;--ink:#eaf2f6;--mut:#8fa6b5;--line:#1a3649;
    --hero1:#0f3550;--hero2:#14506b;--hero-mute:#9fc0d3;
    --air:60,195,216;--dir:232,121,178;--ext:190,206,70;
    --ok:#4fdc9c;--ok-bg:#0f3a30;--warn:#f3b95f;--warn-bg:#3a2c12;--warn-line:#6e4f1d;--off:#a3b6c4;--off-bg:#173345;
    --bad:#ff7b84;--bad-bg:#3d1a20;--info:#8fc2ff;--info-bg:#12304d;
    --accent:#3cc3d8;--accent-ink:#04202a;--tabs:#0a1b28;--tabon:#24425a;
    --shadow:0 1px 2px rgba(0,0,0,.4)
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.35}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px))}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.backbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;text-decoration:none;box-shadow:var(--shadow);flex:0 0 auto}
.logo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.ttl b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.ttl span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:8px 12px;border-radius:99px;border:0;min-height:40px;max-width:58%;text-align:left;line-height:1.2}
.sync i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.sync .meta{display:block;font-weight:600;font-size:10.5px;opacity:.85;margin-top:1px}
.sync.ok{background:var(--ok-bg);color:var(--ok)}
.sync.busy{background:var(--info-bg);color:var(--info)}
.sync.busy i{animation:pulse 1s infinite}
.sync.stale{background:var(--warn-bg);color:var(--warn)}
.sync.off{background:var(--off-bg);color:var(--off)}
@keyframes pulse{50%{opacity:.25}}
.note{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:700;line-height:1.35;background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.info{background:var(--info-bg);color:var(--info)}
.note .x{margin-left:auto;border:0;background:transparent;font-size:18px;min-width:32px;min-height:32px;color:inherit}
.view{display:flex;gap:4px;background:var(--tabs);border-radius:16px;padding:4px;margin-bottom:12px}
.view button{flex:1;min-height:46px;border:0;background:transparent;border-radius:13px;font-size:14px;font-weight:800;color:var(--mut);padding:0 6px}
.view button.on{background:var(--tabon);color:var(--ink);box-shadow:0 1px 3px rgba(10,34,51,.16)}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 12px}
.month .nav{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink);box-shadow:var(--shadow);flex:0 0 auto}
.month .nav:disabled{opacity:.35}
.month .nav:active{transform:scale(.94)}
.mid-m{flex:1;text-align:center;min-width:0}
.mid-m b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
.hoy{margin-top:3px;border:0;background:var(--off-bg);color:var(--off);font-size:12px;font-weight:700;border-radius:99px;padding:5px 12px;min-height:28px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:22px 22px 20px;box-shadow:0 18px 34px -16px rgba(10,34,51,.7)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;box-shadow:0 0 0 30px rgba(255,255,255,.035),0 0 0 62px rgba(255,255,255,.022)}
.hero>*{position:relative;z-index:1}
.hero-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-mute);font-weight:700}
.hero-big{font-size:50px;line-height:1.05;font-weight:800;letter-spacing:-.035em;margin:8px 0 4px}
.hero-big small{font-size:27px;font-weight:700;opacity:.65;margin-right:3px;letter-spacing:0}
.hero-s{font-size:14px;color:var(--hero-mute);font-weight:600}
.hero-row{display:flex;align-items:center;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.ring{position:relative;width:72px;height:72px;flex:0 0 auto}
.ring svg{display:block;width:72px;height:72px;transform:rotate(-90deg);fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.16)}
.ring .fg{stroke:#4ade9f;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800;letter-spacing:-.02em}
.hero-txt b{display:block;font-size:15px;font-weight:700}
.hero-txt span{display:block;font-size:13px;color:var(--hero-mute);font-weight:600;margin-top:3px}
.prog{height:14px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin:16px 0 8px}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:#4ade9f;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.prog.full i{background:#ffd479}
.tope{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--hero-mute);font-weight:600}
.tope button{border:0;border-radius:99px;min-height:36px;padding:0 14px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700}
.tform{display:none;gap:8px;margin-top:12px}
.tform.on{display:flex}
.tform input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:0;padding:0 12px;font-size:16px;font-weight:700;background:#fff;color:#0a2233}
.tform button{min-height:46px;border:0;border-radius:12px;padding:0 14px;font-weight:800;font-size:14px;background:#4ade9f;color:#04231a}
.tform button.g{background:rgba(255,255,255,.14);color:#fff}
.sticky{position:sticky;top:0;z-index:3;padding:10px 0 8px;margin-top:6px;background:linear-gradient(var(--bg) 80%,transparent)}
.tabs{display:flex;gap:4px;background:var(--tabs);border-radius:14px;padding:4px}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;border-radius:11px;padding:0 4px;font-size:13.5px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--tabon);color:var(--ink);box-shadow:0 1px 3px rgba(10,34,51,.16)}
.pane{display:none}
.pane.on{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;gap:10px}
.panel-h b{font-size:14px;font-weight:800}
.panel-h span{font-size:13px;font-weight:800}
.rbar{display:flex;height:24px;border-radius:99px;overflow:hidden;margin:10px 0 4px;background:var(--off-bg)}
.rbar .sg{display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;height:100%;background:rgb(var(--c))}
.rbar .sg.h{background:repeating-linear-gradient(135deg,rgb(var(--c)) 0 4px,rgba(var(--c),.3) 4px 8px)}
.rbar .sg.cs{border-left:2px solid var(--surface)}
.rbar .sg span{font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.34);border-radius:99px;padding:1px 7px;line-height:1.35;white-space:nowrap}
.rmk{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px}
.rmk u{display:inline-block;width:20px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--mut);text-decoration:none}
.rmk u.h{background:repeating-linear-gradient(135deg,var(--mut) 0 3px,rgba(128,140,150,.3) 3px 6px);margin-left:10px}
.lg{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.lg:first-of-type{border-top:0}
.lg i{width:10px;height:10px;border-radius:50%;background:rgb(var(--c));flex:0 0 auto}
.lg b{flex:1;font-weight:700}
.lg em{font-style:normal;font-size:12px;color:var(--mut);font-weight:700;min-width:38px;text-align:right}
.lg strong{font-weight:800;min-width:84px;text-align:right}
.cas{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;gap:10px}
.cas:first-of-type{border-top:0}
.cas b{font-weight:800}
.cas.tot{font-size:15px;font-weight:800}
.cas.tot b{font-size:17px}
.cas .neg{color:var(--bad)}
.cas small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:1px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi small{display:block;font-size:11.5px;color:var(--mut);font-weight:700}
.kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.group{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 2px 10px}
.group span{letter-spacing:0;font-size:13px;white-space:nowrap}
.item{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:9px;min-height:64px;box-shadow:var(--shadow)}
button.item{transition:transform .12s}
button.item:active{transform:scale(.985)}
.tile{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto;background:rgba(var(--c),.16);color:rgb(var(--c))}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid span{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:0 0 auto}
.amt{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:4px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.off{background:var(--off-bg);color:var(--off)}
.chip.info{background:var(--info-bg);color:var(--info)}
.sub{padding:0 6px 6px}
.sub .srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-top:0;background:var(--surface);font-size:13.5px}
.sub .srow:last-child{border-radius:0 0 14px 14px}
.sub .srow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.sub .srow span{color:var(--mut);font-weight:600;font-size:12.5px}
.empty{padding:22px 16px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);color:var(--mut);font-weight:600;text-align:center;margin-top:12px}
.gate{margin-top:20px;padding:26px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.gate h2{font-size:19px;font-weight:800;margin-bottom:6px}
.gate p{color:var(--mut);font-weight:600;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:0 22px;border:0;text-decoration:none}
details.ver{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.ver summary{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--mut)}
details.ver ul{list-style:none;padding:0 0 12px}
details.ver li{display:flex;gap:8px;padding:5px 0;font-size:13px;font-weight:600}
details.ver li b{flex:0 0 18px}
details.ver li.ok b{color:var(--ok)}
details.ver li.bad b{color:var(--bad)}
.foot{margin-top:14px;text-align:center;font-size:12px;color:var(--mut);font-weight:600}
@media (min-width:700px){
  .app{max-width:720px;padding-left:24px;padding-right:24px}
  .hero-big{font-size:58px}
}
@media (min-width:1000px){
  .app{max-width:1240px}
  .dash{display:grid;grid-template-columns:minmax(380px,440px) minmax(0,1fr);gap:24px;align-items:start}
  .dash>.left{position:sticky;top:12px}
  .sticky{position:static;background:none;padding-top:0;margin-top:0}
  .view{max-width:520px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="who">
      <a class="backbtn" href="../dashboard/" aria-label="Volver al dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <img class="logo" src="../Cima-Blanca-logo.png" alt="Cima Blanca">
      <div class="ttl"><b>Cima Blanca</b><span>Panel de ingresos</span></div>
    </div>
    <button type="button" class="sync off" id="syncPill" aria-live="polite"><i></i><span><span id="syncTxt">Sin conectar</span><span class="meta" id="syncMeta"></span></span></button>
  </div>
  <div class="note" id="note" hidden><span id="noteTxt"></span><button class="x" type="button" id="noteX" aria-label="Cerrar">×</button></div>

  <div id="gate" class="gate" hidden>
    <h2>Conecta tus datos</h2>
    <p>Para ver tus ingresos, Luna necesita leer el resumen más reciente desde tu Drive.</p>
    <button type="button" class="btn" id="gateBtn">Conectar con Google</button>
  </div>

  <div id="main" hidden>
    <div class="view" role="tablist" aria-label="Vista">
      <button type="button" role="tab" id="vR" class="on" aria-selected="true">Rendimiento del mes</button>
      <button type="button" role="tab" id="vL" aria-selected="false">Liquidaciones</button>
    </div>

    <section id="secR">
      <div class="month">
        <button type="button" class="nav" id="mPrev" aria-label="Mes anterior">◀</button>
        <div class="mid-m"><b id="mLbl"></b><button type="button" class="hoy" id="mHoy" hidden>Ir a este mes</button></div>
        <button type="button" class="nav" id="mNext" aria-label="Mes siguiente">▶</button>
      </div>
      <div class="dash">
        <div class="left">
          <div class="hero" aria-label="Generado en el mes">
            <div class="hero-l" id="rLabel"></div>
            <div class="hero-big" id="rBig"></div>
            <div class="hero-s" id="rSub"></div>
            <div class="hero-row">
              <div class="ring"><svg viewBox="0 0 80 80"><circle class="tr" cx="40" cy="40" r="34"/><circle class="fg" id="rRing" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="213.6"/></svg><span id="rPct"></span></div>
              <div class="hero-txt"><b id="rT1"></b><span id="rT2"></span></div>
            </div>
          </div>
          <div class="kpis">
            <div class="kpi"><small>Noches dormidas</small><b id="kN"></b></div>
            <div class="kpi"><small>Neto por noche</small><b id="kA"></b></div>
          </div>
        </div>
        <div class="right-col">
          <div class="sticky"><div class="tabs" role="tablist" id="tabs">
            <button type="button" role="tab" data-t="res" class="on" aria-selected="true">Resumen</button>
            <button type="button" role="tab" data-t="air" aria-selected="false">Airbnb</button>
            <button type="button" role="tab" data-t="dir" aria-selected="false">Directas</button>
            <button type="button" role="tab" data-t="ext" aria-selected="false">Extras</button>
          </div></div>
          <div class="pane on" id="p-res"></div>
          <div class="pane" id="p-air"></div>
          <div class="pane" id="p-dir"></div>
          <div class="pane" id="p-ext"></div>
        </div>
      </div>
    </section>

    <section id="secL" hidden>
      <div class="dash">
        <div class="left">
          <div class="hero" aria-label="Acumulado en Airbnb">
            <div class="hero-l">Acumulado en Airbnb · por transferir</div>
            <div class="hero-big" id="lBig"></div>
            <div class="hero-s" id="lSub"></div>
            <div class="prog" id="lProg"><i id="lBar"></i></div>
            <div class="tope"><span id="lTope"></span><button type="button" id="lEdit">Cambiar tope</button></div>
            <form class="tform" id="tForm"><input id="tIn" inputmode="decimal" aria-label="Tope en dólares" placeholder="1800"><button type="submit">Guardar</button><button type="button" class="g" id="tReset">1.800</button></form>
          </div>
        </div>
        <div class="right-col">
          <div id="lBody"></div>
        </div>
      </div>
    </section>

    <details class="ver" id="ver"><summary id="verSum">Cómo se verificó</summary><ul id="verList"></ul></details>
    <div class="foot" id="foot"></div>
  </div>
</div>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function moneyBig(n){n=r2(n);var p=Math.abs(n).toFixed(2).split(".");return "<small>$</small>"+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+"<small>,"+p[1]+"</small>";}
function pad(n){return (n<10?"0":"")+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(s,n){var p=s.split("-");var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
function mLabel(mk){var p=mk.split("-");return MESES[+p[1]-1]+" "+p[0];}
function dShort(s){var p=s.split("-");return +p[2]+" "+MC[+p[1]-1];}
function fmtStamp(iso){if(!iso)return "";var d=new Date(iso);if(isNaN(d))return "";return d.getDate()+" "+MC[d.getMonth()]+" · "+pad(d.getHours())+":"+pad(d.getMinutes());}
function inits(n){var w=String(n||"?").trim().split(/\s+/);return ((w[0]||"?")[0]+((w[1]||"")[0]||"")).toUpperCase();}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k);}catch(e){}}

/* ---------- cálculo ---------- */
function indexRes(){
  var by={};(M.reservas||[]).forEach(function(r){by[r.codigo_confirmacion]=r;});return by;
}
function calcMonth(mk){
  var o={air:{nD:0,nP:0,bD:0,bP:0,gD:0,gP:0,rows:[]},dir:{nD:0,nP:0,bD:0,bP:0,gD:0,gP:0,rows:[]},
    ext:{cD:0,cP:0,sin:0,rows:[],rowsSin:[]}};
  (M.reservas||[]).forEach(function(r){
    var ns=+r.noches||0;if(!ns)return;
    var isDir=r.origen==="Reserva directa";var a=isDir?o.dir:o.air;
    var neto=+r.monto||0,bru=(+r.ingresos_brutos||neto);
    var inM=0,inMD=0,nD=0,nP=0;
    for(var i=0;i<ns;i++){
      var d=addDays(r.fecha_inicio,i);if(d.slice(0,7)!==mk)continue;
      inM++;
      if(d<HOY){a.nD++;a.bD+=neto/ns;a.gD+=bru/ns;nD++;}else{a.nP++;a.bP+=neto/ns;a.gP+=bru/ns;nP++;}
    }
    if(inM)a.rows.push({r:r,inM:inM,ns:ns,share:neto*inM/ns,nD:nD,nP:nP});
  });
  var by=indexRes();
  (M.ingresos_adicionales||[]).forEach(function(x){
    var r=by[x.codigo_confirmacion];if(!r||r.fecha_inicio.slice(0,7)!==mk)return;
    var m=+x.monto||0;
    if(x.medio_cobro==="SIN PAGO"){o.ext.sin+=m;o.ext.rowsSin.push({x:x,r:r});}
    else{if(r.fecha_inicio<=HOY)o.ext.cD+=m;else o.ext.cP+=m;o.ext.rows.push({x:x,r:r});}
  });
  var neD=o.air.bD+o.dir.bD,neP=o.air.bP+o.dir.bP;
  o.netoD=neD;o.netoP=neP;o.brutoD=o.air.gD+o.dir.gD;o.brutoP=o.air.gP+o.dir.gP;
  o.comD=o.air.gD-o.air.bD;o.comP=o.air.gP-o.air.bP;
  o.totD=neD+o.ext.cD;o.totP=neP+o.ext.cP;o.nD=o.air.nD+o.dir.nD;o.nP=o.air.nP+o.dir.nP;
  o.reservas=o.air.rows.length+o.dir.rows.length;
  return o;
}
function monthRange(){
  var a=null,b=null;(M.reservas||[]).forEach(function(r){var s=r.fecha_inicio.slice(0,7),e=addDays(r.fecha_inicio,Math.max((+r.noches||1)-1,0)).slice(0,7);
    if(!a||s<a)a=s;if(!b||e>b)b=e;});
  if(!a)a=HOY.slice(0,7);if(!b)b=a;if(HOY.slice(0,7)>b)b=HOY.slice(0,7);
  return [a,b];
}
function shiftMonth(mk,n){var p=mk.split("-");var d=new Date(Date.UTC(+p[0],+p[1]-1+n,1));return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1);}

function calcLiq(){
  var rows=(M.reservas||[]).filter(function(r){return r.origen==="Airbnb"&&r.estado==="Por liquidar";});
  var lib=[],fut=[];
  rows.forEach(function(r){(r.fecha_inicio<HOY?lib:fut).push(r);});
  var groups={};lib.forEach(function(r){var k=r.fecha_inicio.slice(0,7);(groups[k]=groups[k]||[]).push(r);});
  var keys=Object.keys(groups).sort();
  var acum=0;lib.forEach(function(r){acum+=+r.monto||0;});
  var futTot=0;fut.forEach(function(r){futTot+=+r.monto||0;});
  return {lib:lib,fut:fut,groups:groups,keys:keys,acum:r2(acum),futTot:r2(futTot)};
}
function getTope(){var v=parseFloat(lsGet(K_TOPE));return (isFinite(v)&&v>0)?v:TOPE_DEF;}

/* ---------- verificación contra el resumen del maestro ---------- */
function verificar(){
  var out=[],R=M.resumen||{};
  function chk(ok,t){out.push({ok:ok,t:t});}
  var sumN=0,sumB=0;(M.reservas||[]).forEach(function(r){sumN+=+r.monto||0;sumB+=(+r.ingresos_brutos||+r.monto||0);});
  chk(Math.abs(sumN-R.hospedaje_neto)<0.02,"Neto de hospedaje: reservas "+money(sumN)+" · resumen "+money(R.hospedaje_neto));
  chk(Math.abs(sumB-R.hospedaje_bruto)<0.02,"Bruto de hospedaje: reservas "+money(sumB)+" · resumen "+money(R.hospedaje_bruto));
  chk((M.reservas||[]).length===R.reservas_totales,"Reservas: "+(M.reservas||[]).length+" · resumen "+R.reservas_totales);
  var L=calcLiq();
  chk(Math.abs(L.acum+L.futTot-R.hospedaje_neto_por_liquidar)<0.02,"Por liquidar: acumulado "+money(L.acum)+" + futuras "+money(L.futTot)+" · resumen "+money(R.hospedaje_neto_por_liquidar));
  var cob=0,sin=0;(M.ingresos_adicionales||[]).forEach(function(x){if(x.medio_cobro==="SIN PAGO")sin+=+x.monto||0;else cob+=+x.monto||0;});
  chk(Math.abs(cob-R.adicionales_cobrados)<0.02,"Adicionales cobrados: "+money(cob)+" · resumen "+money(R.adicionales_cobrados));
  chk(Math.abs(sin-R.ahorro_limpieza_no_show)<0.02,"Sin cobrar (no-show): "+money(sin)+" · resumen "+money(R.ahorro_limpieza_no_show));
  var by=indexRes(),huer=0;(M.ingresos_adicionales||[]).forEach(function(x){if(!by[x.codigo_confirmacion])huer++;});
  chk(huer===0,"Adicionales sin reserva asociada: "+huer);
  return out;
}

/* ---------- pintado ---------- */
function bar(segs,total){
  var h='<div class="rbar" role="img" aria-label="Distribución del ingreso">';var first=true;
  segs.forEach(function(s){
    if(s.v<=0.004||total<=0)return;var pct=s.v/total*100;
    h+='<div class="sg'+(s.h?' h':'')+(first?'':' cs')+'" style="--c:'+s.c+';flex:'+s.v+' 1 0">'+(pct>=15&&!s.h?'<span>'+Math.round(pct)+'%</span>':'')+'</div>';first=false;
  });
  return h+'</div>';
}
function renderR(){
  var mk=curMonth,o=calcMonth(mk),rg=monthRange();
  $("mLbl").textContent=mLabel(mk);
  $("mPrev").disabled=mk<=rg[0];$("mNext").disabled=mk>=rg[1];
  $("mHoy").hidden=(mk===HOY.slice(0,7));
  var totAll=o.totD+o.totP;
  $("rLabel").textContent="Generado en "+MESES[+mk.slice(5)-1]+" · neto";
  $("rBig").innerHTML=moneyBig(o.totD);
  $("rSub").textContent=o.totP>0.004?("+ "+money(o.totP)+" por dormir en el resto del mes"):(totAll>0?"Todo lo reservado de este mes ya se durmió":"Sin reservas en este mes");
  var pct=(o.nD+o.nP)>0?Math.round(o.nD/(o.nD+o.nP)*100):0;
  $("rPct").textContent=pct+"%";
  $("rRing").style.strokeDashoffset=(213.6*(1-pct/100)).toFixed(1);
  $("rT1").textContent=(o.nD+o.nP)+" noches reservadas";
  $("rT2").textContent=o.nD+" ya dormidas"+(o.nP?" · "+o.nP+" por dormir":"");
  $("kN").textContent=o.nD;
  var nd=o.nD>0?o.netoD/o.nD:0;
  $("kA").textContent=o.nD>0?money(nd):"—";

  /* Resumen */
  var tot=o.totD+o.totP;var segs=[
    {c:"var(--air)",v:o.air.bD},{c:"var(--air)",v:o.air.bP,h:1},
    {c:"var(--dir)",v:o.dir.bD},{c:"var(--dir)",v:o.dir.bP,h:1},
    {c:"var(--ext)",v:o.ext.cD},{c:"var(--ext)",v:o.ext.cP,h:1}];
  var res='<div class="panel"><div class="panel-h"><b>¿De dónde viene?</b><span>'+money(tot)+'</span></div>';
  if(tot>0.004){
    res+=bar(segs,tot);
    res+='<div class="rmk"><u></u>Ya durmió'+(o.totP>0?'<u class="h"></u>Por dormir':'')+'</div>';
    [["air","Airbnb",o.air.bD+o.air.bP],["dir","Directas",o.dir.bD+o.dir.bP],["ext","Extras cobrados",o.ext.cD+o.ext.cP]].forEach(function(l){
      res+='<div class="lg" style="--c:var(--'+l[0]+')"><i></i><b>'+l[1]+'</b><em>'+(l[2]>0?Math.round(l[2]/tot*100)+'%':'')+'</em><strong>'+money(l[2])+'</strong></div>';
    });
  } else res+='<div class="empty" style="margin-top:6px">No hay ingresos en este mes.</div>';
  res+='</div>';
  res+='<div class="panel"><div class="panel-h"><b>Del bruto al neto</b><span></span></div>'+
    '<div class="cas"><span>Hospedaje bruto<small>Airbnb + directas, noches dormidas</small></span><b>'+money(o.brutoD)+'</b></div>'+
    '<div class="cas"><span>Comisión de Airbnb</span><b class="neg">− '+money(o.comD)+'</b></div>'+
    '<div class="cas"><span>Hospedaje neto</span><b>'+money(o.netoD)+'</b></div>'+
    '<div class="cas"><span>Extras cobrados</span><b>+ '+money(o.ext.cD)+'</b></div>'+
    '<div class="cas tot"><span>Total generado</span><b>'+money(o.totD)+'</b></div></div>';
  if(o.ext.sin>0.004)res+='<div class="panel"><div class="panel-h"><b>Sin cobrar</b><span>'+money(o.ext.sin)+'</span></div><div class="rmk" style="margin:0">No-show de limpieza: ahorro que no entra a caja ni suma al total.</div></div>';
  $("p-res").innerHTML=res;

  /* listas */
  $("p-air").innerHTML=resList(o.air.rows,"air");
  $("p-dir").innerHTML=resList(o.dir.rows,"dir");
  var ex="";
  if(o.ext.rows.length){
    ex+='<div class="group">Cobrados<span>'+money(o.ext.cD+o.ext.cP)+'</span></div>';
    o.ext.rows.sort(function(a,b){return a.r.fecha_inicio<b.r.fecha_inicio?-1:1;}).forEach(function(e){ex+=extRow(e,false);});
  }
  if(o.ext.rowsSin.length){
    ex+='<div class="group">Sin cobrar · no es caja<span>'+money(o.ext.sin)+'</span></div>';
    o.ext.rowsSin.forEach(function(e){ex+=extRow(e,true);});
  }
  if(!ex)ex='<div class="empty">Sin extras en este mes.</div>';
  ex+='<div class="rmk" style="margin-top:10px">Los extras se cuentan en el mes de entrada de su reserva.</div>';
  $("p-ext").innerHTML=ex;
  $("tabs").querySelector('[data-t="air"]').textContent="Airbnb · "+o.air.rows.length;
  $("tabs").querySelector('[data-t="dir"]').textContent="Directas · "+o.dir.rows.length;
  $("tabs").querySelector('[data-t="ext"]').textContent="Extras · "+(o.ext.rows.length+o.ext.rowsSin.length);
}
function resList(rows,key){
  if(!rows.length)return '<div class="empty">Sin reservas de este origen en el mes.</div>';
  rows.sort(function(a,b){return a.r.fecha_inicio<b.r.fecha_inicio?-1:1;});
  var h="";
  rows.forEach(function(e){
    var r=e.r,split=e.inM<e.ns;
    var chip=r.origen==="Reserva directa"?'<span class="chip ok">Cobrada</span>':(r.estado==="Liquidado"?'<span class="chip ok">Liquidado</span>':'<span class="chip warn">Por liquidar</span>');
    h+='<div class="item" style="--c:var(--'+key+')"><div class="tile">'+esc(inits(r.huesped))+'</div><div class="mid"><b>'+esc(r.huesped)+'</b><span>'+dShort(r.fecha_inicio)+' → '+dShort(r.fecha_finalizacion)+' · '+(split?e.inM+' de '+e.ns+' noches en el mes':e.ns+(e.ns===1?' noche':' noches'))+'</span></div><div class="right"><span class="amt">'+money(e.share)+'</span>'+chip+'</div></div>';
  });
  return h;
}
function extRow(e,sin){
  var x=e.x,r=e.r;
  return '<div class="item" style="--c:var(--ext)"><div class="tile">'+esc(inits(r.huesped))+'</div><div class="mid"><b>'+esc(x.item||x.concepto||"Extra")+'</b><span>'+esc(r.huesped)+' · '+dShort(r.fecha_inicio)+'</span></div><div class="right"><span class="amt">'+money(x.monto)+'</span><span class="chip '+(sin?'off':'ok')+'">'+esc(sin?'Sin pago':String(x.medio_cobro||'').toLowerCase().replace(/^./,function(c){return c.toUpperCase();}))+'</span></div></div>';
}

function renderL(){
  var L=calcLiq(),tope=getTope();
  $("lBig").innerHTML=moneyBig(L.acum);
  var falta=r2(tope-L.acum),full=falta<=0;
  $("lSub").textContent=full?("Ya superas el tope de "+money(tope)+": Airbnb debería transferir en la próxima liberación"):("Faltan "+money(falta)+" para llegar al tope");
  $("lBar").style.width=Math.min(100,tope>0?L.acum/tope*100:0).toFixed(1)+"%";
  $("lProg").className="prog"+(full?" full":"");
  $("lTope").textContent="Tope: "+money(tope);
  var h="";
  if(L.keys.length){
    h+='<div class="group">Línea del tiempo<span>por mes de entrada</span></div>';
    L.keys.forEach(function(k,i){
      var rs=L.groups[k].sort(function(a,b){return a.fecha_inicio<b.fecha_inicio?-1:1;});var sum=0;rs.forEach(function(r){sum+=+r.monto||0;});
      var old=k<HOY.slice(0,7);
      h+='<button type="button" class="item" data-g="'+k+'" aria-expanded="false" style="--c:var(--air)"><div class="tile">'+MC[+k.slice(5)-1].toUpperCase().slice(0,3)+'</div><div class="mid"><b style="text-transform:capitalize">'+MESES[+k.slice(5)-1]+' '+k.slice(0,4)+'</b><span>'+rs.length+(rs.length===1?' reserva':' reservas')+(old?' · arrastrado':' · mes en curso')+'</span></div><div class="right"><span class="amt">'+money(sum)+'</span><span class="chip '+(old?'warn':'info')+'">'+(old?'Arrastrado':'En curso')+'</span></div></button>';
      h+='<div class="sub" id="g-'+k+'" hidden>';
      rs.forEach(function(r){h+='<div class="srow"><b>'+esc(r.huesped)+'</b><span>'+dShort(r.fecha_inicio)+' → '+dShort(r.fecha_finalizacion)+'</span><b style="flex:0 0 auto">'+money(r.monto)+'</b></div>';});
      h+='</div>';
    });
  } else h+='<div class="empty">Airbnb no tiene saldo acumulado por transferirte.</div>';
  if(L.fut.length){
    h+='<div class="group">Aún no libera<span>'+money(L.futTot)+'</span></div>';
    L.fut.sort(function(a,b){return a.fecha_inicio<b.fecha_inicio?-1:1;}).forEach(function(r){
      h+='<div class="item" style="--c:var(--air)"><div class="tile">'+esc(inits(r.huesped))+'</div><div class="mid"><b>'+esc(r.huesped)+'</b><span>Entra el '+dShort(r.fecha_inicio)+' · se libera al día siguiente</span></div><div class="right"><span class="amt">'+money(r.monto)+'</span><span class="chip off">Futura</span></div></div>';
    });
  }
  h+='<div class="rmk" style="margin-top:10px">Se acumula lo de reservas cuya entrada ya ocurrió y Airbnb aún no transfiere. El tope es el saldo que activa la transferencia; lo puedes cambiar arriba.</div>';
  $("lBody").innerHTML=h;
  Array.prototype.forEach.call($("lBody").querySelectorAll("[data-g]"),function(b){
    b.addEventListener("click",function(){var k=b.getAttribute("data-g");var s=$("g-"+k);var open=s.hidden;s.hidden=!open;b.setAttribute("aria-expanded",open?"true":"false");});
  });
}
function renderVer(){
  var v=verificar();var bad=v.filter(function(x){return !x.ok;}).length;verBad=bad>0;
  $("verSum").textContent=bad?("⚠ "+bad+" cifra(s) no cuadran con el resumen — toca para ver"):"✓ Las cifras cuadran con el resumen del maestro";
  $("verList").innerHTML=v.map(function(x){return '<li class="'+(x.ok?'ok':'bad')+'"><b>'+(x.ok?'✓':'⚠')+'</b><span>'+esc(x.t)+'</span></li>';}).join("");
  $("foot").textContent="Datos al "+fmtStamp(M.generado)+" · "+(M.reservas||[]).length+" reservas · hoy "+dShort(HOY);
}
function renderAll(){
  $("gate").hidden=true;$("main").hidden=false;
  renderR();renderL();renderVer();
}

/* ---------- Drive: leer, verificar frescura, actualizar ---------- */
function dfetch(url){return fetch(url,{headers:{Authorization:"Bearer "+token}}).then(function(r){
  if(!r.ok)throw new Error("Drive respondió "+r.status);return r;});}
function djson(url){return dfetch(url).then(function(r){return r.json();});}
function listQ(q,fields){return djson("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&fields=files("+fields+")&pageSize=100").then(function(d){return d.files||[];});}
function childFolder(pid,needle){return listQ("'"+pid+"' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false","id,name").then(function(fs){
  var m=fs.filter(function(f){return f.name.toLowerCase().indexOf(needle.toLowerCase())!==-1;})[0];if(!m)throw new Error("No encontré la carpeta «"+needle+"».");return m;});}
function filesIn(pid){return listQ("'"+pid+"' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'","id,name,modifiedTime");}

function revisar(){
  setState("busy","Revisando datos…","");
  var maxSrc="",maestro=null;
  return listQ("name='"+F_ROOT+"' and mimeType='application/vnd.google-apps.folder' and trashed=false","id,name").then(function(rs){
    if(!rs.length)throw new Error("No encontré la carpeta «"+F_ROOT+"».");return childFolder(rs[0].id,F_ING);
  }).then(function(ing){
    return Promise.all([childFolder(ing.id,F_RES),childFolder(ing.id,"Adicionales").catch(function(){return null;}),Promise.resolve(ing)]);
  }).then(function(a){
    var res=a[0],adF=a[1],ing=a[2];
    return Promise.all([childFolder(res.id,F_RAW),childFolder(res.id,F_PROC),filesIn(res.id),filesIn(adF?adF.id:ing.id)]);
  }).then(function(b){
    var raw=b[0],proc=b[1],resFiles=b[2],adFiles=b[3];
    resFiles.concat(adFiles).forEach(function(f){if(/directas|adicionales/i.test(f.name)&&!/\.csv$/i.test(f.name)&&f.modifiedTime>maxSrc)maxSrc=f.modifiedTime;});
    return Promise.all([childFolder(raw.id,"Pagados"),childFolder(raw.id,"Pendientes"),filesIn(proc.id)]);
  }).then(function(c){
    maestro=c[2].filter(function(f){return f.name===MAESTRO_NAME;})[0];
    if(!maestro)throw new Error("No encontré el resumen de ingresos en PROCESADO. Corre «Sincronizar con Drive».");
    return Promise.all([filesIn(c[0].id),filesIn(c[1].id)]);
  }).then(function(d){
    d[0].concat(d[1]).forEach(function(f){if(/\.csv$/i.test(f.name)&&f.modifiedTime>maxSrc)maxSrc=f.modifiedTime;});
    var stale=maxSrc&&maxSrc>maestro.modifiedTime;
    var verOk=lsGet(K_VER)===ING_VER;
    if((stale||!verOk)){
      var g=parseInt(ssGet(K_GUARD)||"0",10);
      if(!g||Date.now()-g>10*60*1000){
        ssSet(K_GUARD,String(Date.now()));
        setState("busy","Actualizando…","hay archivos nuevos");
        showNote("Hay archivos nuevos en Drive. Actualizando tus ingresos…","info");
        setTimeout(function(){location.href="../sincronizar/?auto=1&volver=ingresos";},900);
        return "redirect";
      }
      return cargarMaestro(maestro).then(function(){
        setState("stale","Desactualizado",fmtStamp(M.generado));
        showNote("Hay archivos nuevos que no se pudieron procesar. Toca el estado para volver a intentarlo.");
      });
    }
    ssDel(K_GUARD);
    return cargarMaestro(maestro).then(function(){
      setState("ok","Al día",fmtStamp(M.generado));
      if(verBad)showNote("Algunas cifras no cuadran con el resumen. Abre «Cómo se verificó» al final.");
    });
  });
}
function cargarMaestro(f){
  var cached=null;try{cached=JSON.parse(lsGet(K_CACHE)||"null");}catch(e){}
  if(cached&&cached.mod===f.modifiedTime&&cached.data&&M&&M.generado===cached.data.generado){modTime=f.modifiedTime;return Promise.resolve();}
  return dfetch("https://www.googleapis.com/drive/v3/files/"+f.id+"?alt=media").then(function(r){return r.text();}).then(function(t){
    var data=JSON.parse(t);M=data;modTime=f.modifiedTime;
    lsSet(K_CACHE,JSON.stringify({mod:f.modifiedTime,data:data}));
    renderAll();
  });
}
function conectar(){
  if(!tokenClient){showNote("Google todavía no cargó. Espera un segundo y reintenta.");return;}
  tokenClient.requestAccessToken({});
}
function initGoogle(){
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:function(resp){
      if(resp.error){sinSesion();return;}
      token=resp.access_token;
      revisar().catch(function(e){
        if(M){setState("off","Sin conexión",fmtStamp(M.generado));showNote("No pude revisar Drive ("+(e.message||e)+"). Muestro los últimos datos guardados.");}
        else{$("gate").hidden=false;$("main").hidden=true;setState("off","Sin datos","");showNote("No pude leer Drive: "+(e.message||e));}
      });
    },
    error_callback:function(){sinSesion();}
  });
  try{tokenClient.requestAccessToken({prompt:""});}catch(e){sinSesion();}
}
function sinSesion(){
  if(M){setState("off","Sin conectar",fmtStamp(M.generado));}
  else{setState("off","Sin conectar","");$("gate").hidden=false;}
}
$("gateBtn").addEventListener("click",conectar);
$("syncPill").addEventListener("click",function(){
  if(!token){conectar();return;}
  ssDel(K_GUARD);
  revisar().catch(function(e){setState("off","Sin conexión",M?fmtStamp(M.generado):"");showNote("No pude revisar Drive: "+(e.message||e));});
});

/* ---------- arranque ---------- */
(function boot(){
  var q=location.search.match(/[?&]sync=(ok|al_dia)/);
  var cached=null;try{cached=JSON.parse(lsGet(K_CACHE)||"null");}catch(e){}
  if(cached&&cached.data){M=cached.data;modTime=cached.mod;renderAll();setState("off","Sin verificar",fmtStamp(M.generado));}
  if(q){
    showNote(q[1]==="ok"?"Listo: tus ingresos se actualizaron con los archivos nuevos.":"Tus ingresos ya estaban al día.","ok");
    try{history.replaceState(null,"",location.pathname);}catch(e){}
  }
  var tries=0;
  (function wait(){
    if(window.google&&google.accounts&&google.accounts.oauth2){initGoogle();return;}
    if(++tries>80){ if(!M){$("gate").hidden=false;} setState("off",M?"Sin conexión":"Sin conectar",M?fmtStamp(M.generado):"");return;}
    setTimeout(wait,150);
  })();
})();
window.addEventListener("online",function(){if(token){revisar().catch(function(){});}});
})();
</script>
