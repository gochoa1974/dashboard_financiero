.evo svg{display:block;max-width:100%;height:auto;overflow:visible}

.evo .bh{fill:url(#evH)}
.evo g.m{cursor:pointer;outline:none}
.evo g.m.on .bc{opacity:1}

.evo g.m.off{cursor:default;pointer-events:none}

@media (max-width:360px){.evc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.evo .bc{transition:none}}
</style>

function resList(rows,key){
  if(!rows.length)return '<div class="empty">Sin reservas de este origen en el período.</div>';
  rows.sort(function(a,b){return a.r.fecha_inicio<b.r.fecha_inicio?-1:1;});
  var h="";
  rows.forEach(function(e){
    var r=e.r,split=e.inM<e.ns;
    var chip=r.origen==="Reserva directa"?'<span class="chip ok">Cobrada</span>':(r.estado==="Liquidado"?'<span class="chip ok">Liquidado</span>':'<span class="chip warn">Por liquidar</span>');
    h+='<div class="item" style="--c:var(--'+key+')"><div class="tile">'+esc(inits(r.huesped))+'</div><div class="mid"><b>'+esc(r.huesped)+'</b><span>'+dShort(r.fecha_inicio)+' → '+dShort(r.fecha_finalizacion)+' · '+(split?e.inM+' de '+e.ns+' noches en el mes':e.ns+(e.ns===1?' noche':' noches'))+'</span></div><div class="right"><span class="amt">'+money(e.share)+'</span>'+chip+'</div></div>';
  });
  return h;
}
function extRow(e,sin){

}

/* ---------- Datos: el lector de Apps Script entrega el resumen (sin pantalla de Google) ---------- */
function revisar(){
  setState("busy","Revisando datos…","");
  var cached=null;try{cached=JSON.parse(lsGet(K_CACHE)||"null");}catch(e){}
  var mod=cached&&typeof cached.mod==="number"?cached.mod:0;
  return CB.llamar("maestro",{modificado:mod}).then(function(r){
    var admin=CB.perfil&&CB.perfil.esAdmin;
    var verOk=lsGet(K_VER)===ING_VER;
    var stale=r.desactualizado||(admin&&!verOk);
    if(stale&&admin){
      var g=parseInt(ssGet(K_GUARD)||"0",10);
      if(!g||Date.now()-g>10*60*1000){
        ssSet(K_GUARD,String(Date.now()));
        setState("busy","Actualizando…","hay archivos nuevos");
        showNote("Hay archivos nuevos en Drive. Actualizando tus ingresos…","info");
        setTimeout(function(){location.href="../sincronizar/?auto=1&volver=ingresos";},900);
        return;
      }
    } else if(!stale){ssDel(K_GUARD);}
    if(!r.igual&&r.data){M=r.data;modTime=r.modificado;lsSet(K_CACHE,JSON.stringify({mod:r.modificado,data:r.data}));renderAll();}
    else if(r.igual&&M){modTime=r.modificado;}
    $("gate").hidden=true;$("main").hidden=false;
    if(stale){
      setState("stale","Desactualizado",fmtStamp(M.generado));
      showNote(admin?"Hay archivos nuevos que no se pudieron procesar. Toca el estado para volver a intentarlo.":"Hay archivos nuevos en Drive. Pídele al administrador que sincronice.");
    } else {
      setState("ok","Al día",fmtStamp(M.generado));
      if(verBad)showNote("Algunas cifras no cuadran con el resumen. Abre «Cómo se verificó» al final.");
    }
  });
}
function falloRevisar(e){
  if(M){setState("off","Sin conexión",fmtStamp(M.generado));showNote("No pude revisar los datos ("+(e.message||e)+"). Muestro los últimos guardados.");}
  else{$("gate").hidden=false;$("main").hidden=true;$("gateTxt").textContent=(e.message||"Revisa tu conexión")+". Vuelve a intentar.";setState("off","Sin datos","");}
}
function cargar(){var sin=!M;if(sin)CB.loader(true,"Cargando tus ingresos…");revisar().then(function(){if(sin)CB.loader(false);}).catch(function(e){if(sin)CB.loader(false);falloRevisar(e);});}
$("gateBtn").addEventListener("click",function(){setState("busy","Revisando datos…","");cargar();});
$("syncPill").addEventListener("click",function(){ssDel(K_GUARD);cargar();});

/* ---------- arranque ---------- */
(function boot(){
  var q=location.search.match(/[?&]sync=(ok|al_dia)/);
  var cached=null;try{cached=JSON.parse(lsGet(K_CACHE)||"null");}catch(e){}
  if(cached&&cached.data){M=cached.data;modTime=cached.mod;renderAll();setState("off","Sin verificar",fmtStamp(M.generado));}
  if(q){
    showNote(q[1]==="ok"?"Listo: tus ingresos se actualizaron con los archivos nuevos.":"Tus ingresos ya estaban al día.","ok");
    try{history.replaceState(null,"",location.pathname);}catch(e){}
  }
  if(!M){$("main").hidden=true;}
  CB.ready.then(function(p){ if(p&&!CB.bloqueado)cargar(); else if(!p){CB.alEntrar=function(){cargar();};} });
})();
window.addEventListener("online",function(){if(CB.perfil&&!CB.bloqueado)cargar();});
})();
</script>
</body>
</html>
