<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cima Blanca · Sincronización de Ingresos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2233;
    --navy-2: #1f2a44;
    --azul: #2563eb;
    --verde: #15803d;
    --ambar: #d97706;
    --gris: #6b7280;
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1a2233;
    --text-muted: #6b7280;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #171e2e;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2a3344;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Manrope', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-variant-numeric: tabular-nums;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  header h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  header p { color: var(--text-muted); margin: 0; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--azul); color: #fff; border: none;
    font-family: inherit; font-weight: 700; font-size: 14px;
    padding: 12px 20px; border-radius: 10px; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.secondary { background: transparent; color: var(--azul); border: 1px solid var(--azul); }
  .btn.ok { background: var(--verde); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  }
  .pill.ok { background: #dcfce7; color: var(--verde); }
  .pill.pending { background: #fef3c7; color: var(--ambar); }
  .pill.off { background: #f3f4f6; color: var(--gris); }
  @media (prefers-color-scheme: dark) {
    .pill.ok { background: #0f2a1a; }
    .pill.pending { background: #2a2110; }
    .pill.off { background: #20262f; }
  }
  .log {
    font-size: 13px; color: var(--text-muted);
    max-height: 220px; overflow-y: auto;
    border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px;
  }
  .log div { padding: 3px 0; display: flex; gap: 8px; }
  .log .ts { color: var(--gris); flex-shrink: 0; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; }
  .stat .num { font-size: 26px; font-weight: 800; }
  .stat .label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .error { color: #dc2626; font-size: 13px; margin-top: 10px; }
  svg { width: 18px; height: 18px; flex-shrink: 0; }
  a.folder-link { color: var(--azul); font-size: 13px; text-decoration: none; }
  a.folder-link:hover { text-decoration: underline; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sincronización de Ingresos — Cima Blanca</h1>
    <p>Lee las reservas de Airbnb directo desde Google Drive y arma los archivos consolidados.</p>
  </header>

  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a5 5 0 0 1 5 5v3a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
      Cuenta de Google
    </h2>
    <div id="authStatus" class="row" style="margin-bottom:12px;">
      <span class="pill off" id="authPill">Sin conectar</span>
    </div>
    <button class="btn" id="btnLogin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
      Conectar con Google
    </button>
  </div>

  <div class="card hidden" id="syncCard">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Sincronización
    </h2>
    <button class="btn" id="btnSync">Leer Drive y procesar</button>
    <div class="log" id="log"></div>
    <div class="error hidden" id="errorBox"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
      Resultado
    </h2>
    <div class="stat-grid" id="statGrid"></div>
    <div class="row" style="margin-top:18px;">
      <button class="btn ok" id="btnDownloadJson">Descargar MAESTRO_INGRESOS_CIMA_BLANCA.json</button>
      <button class="btn ok" id="btnDownloadXlsx">Descargar INGRESOS_CONSOLIDADO_CIMA_BLANCA.xlsx</button>
    </div>
    <div style="margin-top:12px;" id="processedLinkWrap"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";

  var CLIENT_ID = "284452253474-nkn76cksdd6hu41f79t7kfnp47iag878.apps.googleusercontent.com";
  var SCOPES = "https://www.googleapis.com/auth/drive.readonly";
  var ROOT_FOLDER_NAME = "CIMA BLANCA";
  var PATH_TO_RESERVAS = ["1. INGRESOS", "1.1 Reservas"];
  var RAW_FOLDER_NAME = "RAW_sin_procesar";
  var PROCESADO_FOLDER_NAME = "PROCESADO";

  var accessToken = null;
  var tokenClient = null;

  var els = {
    authPill: document.getElementById("authPill"),
    btnLogin: document.getElementById("btnLogin"),
    syncCard: document.getElementById("syncCard"),
    btnSync: document.getElementById("btnSync"),
    log: document.getElementById("log"),
    errorBox: document.getElementById("errorBox"),
    resultCard: document.getElementById("resultCard"),
    statGrid: document.getElementById("statGrid"),
    btnDownloadJson: document.getElementById("btnDownloadJson"),
    btnDownloadXlsx: document.getElementById("btnDownloadXlsx"),
    processedLinkWrap: document.getElementById("processedLinkWrap")
  };

  function log(msg) {
    var line = document.createElement("div");
    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = new Date().toLocaleTimeString("es-EC", { hour12: false });
    var txt = document.createElement("span");
    txt.textContent = msg;
    line.appendChild(ts);
    line.appendChild(txt);
    els.log.appendChild(line);
    els.log.scrollTop = els.log.scrollHeight;
  }

  function showError(msg) {
    els.errorBox.textContent = msg;
    els.errorBox.classList.remove("hidden");
    log("Error: " + msg);
  }

  function clearError() {
    els.errorBox.classList.add("hidden");
    els.errorBox.textContent = "";
  }

  function initGoogle() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function (resp) {
        if (resp.error) {
          showError("No se pudo iniciar sesión: " + resp.error);
          return;
        }
        accessToken = resp.access_token;
        els.authPill.textContent = "Conectado";
        els.authPill.className = "pill ok";
        els.syncCard.classList.remove("hidden");
        log("Sesión de Google iniciada.");
      }
    });
    els.btnLogin.disabled = false;
  }

  els.btnLogin.addEventListener("click", function () {
    if (!tokenClient) {
      showError("Google todavía no cargó, espera un segundo y vuelve a intentar.");
      return;
    }
    tokenClient.requestAccessToken();
  });

  function driveFetch(url) {
    return fetch(url, { headers: { Authorization: "Bearer " + accessToken } }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          throw new Error("Drive respondió " + r.status + ": " + t.slice(0, 200));
        });
      }
      return r.json();
    });
  }

  function findChildFolder(parentId, nameContains) {
    var q = "'" + parentId + "' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false";
    var url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) + "&fields=files(id,name)&pageSize=100";
    return driveFetch(url).then(function (data) {
      var needle = nameContains.toLowerCase();
      var match = (data.files || []).find(function (f) { return f.name.toLowerCase().indexOf(needle) !== -1; });
      if (!match) {
        throw new Error("No encontré una carpeta que contenga \"" + nameContains + "\" dentro del padre indicado.");
      }
      return match;
    });
  }

  function findRootFolder(name) {
    var q = "name='" + name.replace(/'/g, "\\'") + "' and mimeType='application/vnd.google-apps.folder' and trashed=false";
    var url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) + "&fields=files(id,name)&pageSize=10";
    return driveFetch(url).then(function (data) {
      if (!data.files || !data.files.length) {
        throw new Error("No encontré la carpeta raíz \"" + name + "\" en tu Drive.");
      }
      return data.files[0];
    });
  }

  function listFilesInFolder(folderId) {
    var q = "'" + folderId + "' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'";
    var url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) + "&fields=files(id,name,modifiedTime,mimeType)&pageSize=100&orderBy=modifiedTime";
    return driveFetch(url).then(function (data) { return data.files || []; });
  }

  function downloadFileText(fileId) {
    var url = "https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media";
    return fetch(url, { headers: { Authorization: "Bearer " + accessToken } }).then(function (r) {
      if (!r.ok) throw new Error("No pude descargar el archivo " + fileId + " (" + r.status + ")");
      return r.text();
    });
  }

  function stripBom(text) {
    return text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
  }

  function parseCsv(text) {
    var result = Papa.parse(stripBom(text), { header: true, skipEmptyLines: true });
    return result.data;
  }

  function cleanCode(c) {
    return (c || "").toString().trim();
  }

  function toNumber(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function buildRecordsForFile(file) {
    // Suma filas del MISMO archivo con el mismo código (reservas pagadas en varios abonos).
    // Las noches no se suman, se toman una sola vez.
    var byCode = {};
    file.rows.forEach(function (row) {
      var tipo = (row["Tipo"] || "").trim();
      if (tipo && tipo !== "Reservación") return;
      var code = cleanCode(row["Código de confirmación"]);
      if (!code) return;
      if (!byCode[code]) {
        byCode[code] = {
          codigo_confirmacion: code,
          huesped: row["Huésped"] || "",
          anuncio: row["Anuncio"] || "",
          fecha_inicio: row["Fecha de inicio"] || "",
          fecha_finalizacion: row["Fecha de finalización"] || "",
          noches: toNumber(row["Noches"]),
          monto: 0,
          ingresos_brutos: 0,
          archivo_origen: file.fileName,
          actualizado: file.modifiedTime
        };
      }
      var rec = byCode[code];
      rec.monto += toNumber(row["Monto"]);
      rec.ingresos_brutos += toNumber(row["Ingresos brutos"]);
    });
    return byCode;
  }

  function buildKeyedRecords(rowsByFile) {
    // rowsByFile: array de { fileName, modifiedTime, rows }. El archivo más reciente
    // REEMPLAZA por completo el registro de un código (nunca se suma entre archivos distintos):
    // dos exportaciones del mismo CSV en fechas distintas no son dos reservas ni dos pagos.
    var sorted = rowsByFile.slice().sort(function (a, b) {
      return (a.modifiedTime || "").localeCompare(b.modifiedTime || "");
    });
    var byCode = {};
    sorted.forEach(function (file) {
      var fileRecords = buildRecordsForFile(file);
      Object.keys(fileRecords).forEach(function (code) {
        byCode[code] = fileRecords[code];
      });
    });
    return byCode;
  }

  function readFolderAsRecords(folderId) {
    return listFilesInFolder(folderId).then(function (files) {
      var csvFiles = files.filter(function (f) { return /\.csv$/i.test(f.name); });
      if (!csvFiles.length) {
        log("No hay archivos .csv en esta carpeta.");
        return {};
      }
      var chain = Promise.resolve();
      var rowsByFile = [];
      csvFiles.forEach(function (f) {
        chain = chain.then(function () {
          log("Leyendo " + f.name + "...");
          return downloadFileText(f.id).then(function (text) {
            rowsByFile.push({ fileName: f.name, modifiedTime: f.modifiedTime, rows: parseCsv(text) });
          });
        });
      });
      return chain.then(function () { return buildKeyedRecords(rowsByFile); });
    });
  }

  function runSync() {
    clearError();
    els.btnSync.disabled = true;
    els.resultCard.classList.add("hidden");
    log("Buscando carpeta raíz \"" + ROOT_FOLDER_NAME + "\"...");

    var reservasFolderId = null;
    var rawFolderId = null;
    var procesadoFolder = null;

    findRootFolder(ROOT_FOLDER_NAME)
      .then(function (root) {
        log("Raíz encontrada. Buscando " + PATH_TO_RESERVAS.join(" → ") + "...");
        return findChildFolder(root.id, PATH_TO_RESERVAS[0]);
      })
      .then(function (ingresos) { return findChildFolder(ingresos.id, PATH_TO_RESERVAS[1]); })
      .then(function (reservas) {
        reservasFolderId = reservas.id;
        log("Carpeta de reservas encontrada. Buscando " + RAW_FOLDER_NAME + " y " + PROCESADO_FOLDER_NAME + "...");
        return Promise.all([
          findChildFolder(reservasFolderId, RAW_FOLDER_NAME),
          findChildFolder(reservasFolderId, PROCESADO_FOLDER_NAME)
        ]);
      })
      .then(function (results) {
        rawFolderId = results[0].id;
        procesadoFolder = results[1];
        return Promise.all([
          findChildFolder(rawFolderId, "Pagados"),
          findChildFolder(rawFolderId, "Pendientes")
        ]);
      })
      .then(function (results) {
        var pagadosFolder = results[0];
        var pendientesFolder = results[1];
        log("Leyendo carpeta Pagados...");
        return Promise.all([
          readFolderAsRecords(pagadosFolder.id),
          readFolderAsRecords(pendientesFolder.id)
        ]);
      })
      .then(function (results) {
        var pagados = results[0];
        var pendientes = results[1];
        log("Cruzando información y deduplicando...");

        var master = [];
        Object.keys(pagados).forEach(function (code) {
          var rec = pagados[code];
          rec.estado = "Liquidado";
          master.push(rec);
        });
        Object.keys(pendientes).forEach(function (code) {
          if (pagados[code]) return; // ya liquidado, pagados manda
          var rec = pendientes[code];
          rec.estado = "Por liquidar";
          master.push(rec);
        });
        master.sort(function (a, b) { return (a.fecha_inicio || "").localeCompare(b.fecha_inicio || ""); });

        showResults(master, procesadoFolder);
      })
      .catch(function (err) {
        showError(err.message || String(err));
      })
      .then(function () {
        els.btnSync.disabled = false;
      });
  }

  function money(n) {
    return "$" + n.toFixed(2);
  }

  function showResults(master, procesadoFolder) {
    log("Listo: " + master.length + " reservas procesadas.");
    var liquidado = master.filter(function (r) { return r.estado === "Liquidado"; });
    var porLiquidar = master.filter(function (r) { return r.estado === "Por liquidar"; });
    var totalBruto = master.reduce(function (s, r) { return s + r.ingresos_brutos; }, 0);

    els.statGrid.innerHTML = "";
    addStat(master.length, "Reservas totales");
    addStat(liquidado.length, "Liquidadas");
    addStat(porLiquidar.length, "Por liquidar");
    addStat(money(totalBruto), "Ingresos brutos");

    els.processedLinkWrap.innerHTML = "";
    if (procesadoFolder && procesadoFolder.id) {
      var a = document.createElement("a");
      a.className = "folder-link";
      a.href = "https://drive.google.com/drive/folders/" + procesadoFolder.id;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Abrir carpeta PROCESADO en Drive para dejar ahí los dos archivos ↗";
      els.processedLinkWrap.appendChild(a);
    }

    els.btnDownloadJson.onclick = function () { downloadJson(master); };
    els.btnDownloadXlsx.onclick = function () { downloadXlsx(master); };

    els.resultCard.classList.remove("hidden");
  }

  function addStat(value, label) {
    var div = document.createElement("div");
    div.className = "stat";
    var num = document.createElement("div");
    num.className = "num";
    num.textContent = value;
    var lab = document.createElement("div");
    lab.className = "label";
    lab.textContent = label;
    div.appendChild(num);
    div.appendChild(lab);
    els.statGrid.appendChild(div);
  }

  function triggerDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadJson(master) {
    var payload = {
      generado: new Date().toISOString(),
      propiedad: "Cima Blanca",
      reservas: master
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    triggerDownload(blob, "MAESTRO_INGRESOS_CIMA_BLANCA.json");
    log("Descargado MAESTRO_INGRESOS_CIMA_BLANCA.json");
  }

  function downloadXlsx(master) {
    var rows = master.map(function (r) {
      return {
        "Código de confirmación": r.codigo_confirmacion,
        "Huésped": r.huesped,
        "Anuncio": r.anuncio,
        "Fecha de inicio": r.fecha_inicio,
        "Fecha de finalización": r.fecha_finalizacion,
        "Noches": r.noches,
        "Monto": r.monto,
        "Ingresos brutos": r.ingresos_brutos,
        "Estado": r.estado,
        "Archivo origen": r.archivo_origen,
        "Actualizado": r.actualizado
      };
    });
    var ws = XLSX.utils.json_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Ingresos");
    XLSX.writeFile(wb, "INGRESOS_CONSOLIDADO_CIMA_BLANCA.xlsx");
    log("Descargado INGRESOS_CONSOLIDADO_CIMA_BLANCA.xlsx");
  }

  els.btnSync.addEventListener("click", runSync);

  window.addEventListener("load", function () {
    if (window.google && google.accounts && google.accounts.oauth2) {
      initGoogle();
    } else {
      var check = setInterval(function () {
        if (window.google && google.accounts && google.accounts.oauth2) {
          clearInterval(check);
          initGoogle();
        }
      }, 200);
    }
  });
})();
</script>
</body>
</html>
