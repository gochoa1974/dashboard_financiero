<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · Cima Blanca</title>
<link rel="icon" type="image/png" href="../Cima-Blanca-logo.png">
<link rel="apple-touch-icon" href="../Cima-Blanca-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf2f4;--surface:#ffffff;--ink:#0a2233;--mut:#5f7080;--line:#dde5ea;
  --hero1:#0a2233;--hero2:#123a52;--hero-mute:#9fc0d3;
  --accent:#0f9d6e;--accent-ink:#ffffff;--accent2:#b45309;
  --shadow:0 1px 2px rgba(10,34,51,.05),0 8px 20px -12px rgba(10,34,51,.2)
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#071722;--surface:#0e2536;--ink:#eaf2f6;--mut:#8fa6b5;--line:#1a3649;
    --hero1:#0f3550;--hero2:#14506b;--hero-mute:#9fc0d3;
    --accent:#2fd49a;--accent-ink:#04231a;--accent2:#f59e0b;
    --shadow:0 1px 2px rgba(0,0,0,.4)
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:420px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:700;
  text-decoration:none;margin-bottom:14px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;
  border-radius:24px;padding:24px 22px;box-shadow:0 18px 34px -16px rgba(10,34,51,.7);text-align:center;margin-bottom:22px}
.hero h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:6px 0 0;font-size:13px;color:var(--hero-mute);font-weight:600}
.menu{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:16px 16px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.card:active{transform:scale(.98)}
.tile{width:48px;height:48px;border-radius:14px;background:rgba(15,157,110,.12);display:grid;place-items:center;
  flex:0 0 auto}
.tile svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8}
.card.c2 .tile{background:rgba(180,83,9,.12)}
.card.c2 .tile svg{stroke:var(--accent2)}
.card .txt b{display:block;font-size:15.5px;font-weight:800}
.card .txt span{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.card .arr{margin-left:auto;color:var(--mut);flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Menú principal
  </a>
  <div class="hero">
    <h1>Dashboard</h1>
    <p>Cima Blanca · Punta Blanca</p>
  </div>
  <div class="menu">
    <a class="card" href="../gastos/">
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M3 10h18M7 15h2M11 15h6M5 6h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt"><b>Gastos</b><span>Registro de gastos y fijos</span></div>
      <div class="arr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>
    <a class="card" href="../ingresos/">
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 7a5 5 0 00-5-2c-2.8 0-5 1.3-5 3.3S9.2 11 12 11s5 1.3 5 3.3-2.2 3.3-5 3.3a5 5 0 01-5-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt"><b>Ingresos</b><span>Sincronización con Drive</span></div>
      <div class="arr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>
    <a class="card c2" href="../cancelaciones/">
      <div class="tile">
        <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.8 17.1a1.9 1.9 0 001.6 2.9h15.2a1.9 1.9 0 001.6-2.9L13.7 3.9a1.9 1.9 0 00-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt"><b>Cancelaciones y bloqueos</b><span>Registro de casos especiales</span></div>
      <div class="arr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </a>
  </div>
</div>
</body>
</html>
